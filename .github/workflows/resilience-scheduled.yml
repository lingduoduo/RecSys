name: resilience-scheduled

on:
  schedule:
    - cron: "17 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run bounded load suite
        run: mvn --batch-mode test -DexcludedGroups=docker -Dgroups=load
      - name: Generate load evidence
        if: always()
        run: python3 scripts/summarize-resilience-results.py --suite load --reports target/surefire-reports --output resilience-evidence-load.json
      - name: Upload load evidence and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resilience-load-evidence
          path: |
            resilience-evidence-load.json
            target/surefire-reports/
          if-no-files-found: warn
          retention-days: 30

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run bounded Docker suite
        run: mvn --batch-mode test -DexcludedGroups=load -Dgroups=docker
      - name: Generate Docker evidence
        if: always()
        run: python3 scripts/summarize-resilience-results.py --suite docker --reports target/surefire-reports --output resilience-evidence-docker.json
      - name: Upload Docker evidence and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resilience-docker-evidence
          path: |
            resilience-evidence-docker.json
            target/surefire-reports/
          if-no-files-found: warn
          retention-days: 30
