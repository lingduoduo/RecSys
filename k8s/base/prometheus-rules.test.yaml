# promtool unit tests for prometheus-rules.yaml.
#
# prometheus-rules.yaml is a Kubernetes PrometheusRule CRD (apiVersion/kind/metadata
# wrapping a `spec.groups` list); promtool's rule loader rejects those top-level fields
# outright since it wants a bare `groups:` document. So rule_files below points at
# prometheus-rules.rules.yaml — a bare-format copy of the CRD's `.spec`, generated (not
# hand-maintained) immediately before the test run and gitignored. Regenerate it any
# time prometheus-rules.yaml changes:
#
#   cd k8s/base
#   yq '.spec' prometheus-rules.yaml > prometheus-rules.rules.yaml
#   promtool test rules prometheus-rules.test.yaml
#
# See .github/workflows/prometheus-rules.yml for the CI form of the same two commands.
#
# Every alert gets a case that MUST fire and a near-miss that MUST NOT. The near-miss
# matters more than it looks: an expression that fires on everything passes a
# fire-only test suite while being useless.
rule_files:
  - prometheus-rules.rules.yaml

evaluation_interval: 1m

tests:
  # --- RecsysTargetDown ---
  - interval: 1m
    input_series:
      - series: 'up{namespace="recsys", job="recsys-api-gateway", instance="10.0.0.1:8010"}'
        values: '1x5 0x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: RecsysTargetDown
        exp_alerts: []          # still up at 4m
      - eval_time: 12m
        alertname: RecsysTargetDown
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: recsys
              job: recsys-api-gateway
              instance: 10.0.0.1:8010
            exp_annotations:
              summary: "recsys-api-gateway has not been scraped for 5 minutes"
              description: >-
                Prometheus cannot scrape recsys-api-gateway (10.0.0.1:8010). Either
                the service is down or its metrics endpoint stopped answering. Its dashboards
                and every other alert in this file are blind for that service until resolved.
                Check the service pod status with kubectl and its logs for startup errors.

  # --- SplunkHecDroppingEvents ---
  - interval: 1m
    input_series:
      - series: 'splunk_hec_events_dropped_total{job="recsys-api-gateway"}'
        values: '0+5x30'        # rising: events being dropped
      - series: 'splunk_hec_events_dropped_total{job="recsys-online-serving"}'
        values: '7+0x30'        # flat: some dropped historically, none now
    alert_rule_test:
      - eval_time: 20m
        alertname: SplunkHecDroppingEvents
        exp_alerts:
          - exp_labels:
              severity: warning
              job: recsys-api-gateway
            exp_annotations:
              summary: "Splunk log shipping is dropping events on recsys-api-gateway"
              description: >-
                The appender's bounded queue filled and events were discarded. Log delivery
                is at-most-once by design, so these are gone from Splunk — stdout remains
                the authoritative copy. Consider raising SPLUNK_HEC_QUEUE_CAPACITY, or
                investigate why the drain thread fell behind.

  # --- SplunkHecIndeterminateDelivery ---
  - interval: 1m
    input_series:
      - series: 'splunk_hec_events_indeterminate_total{job="recsys-online-serving"}'
        values: '0+3x30'        # rising: indeterminate deliveries happening
      - series: 'splunk_hec_events_indeterminate_total{job="recsys-api-gateway"}'
        values: '5+0x30'        # flat: some indeterminate historically, none now
    alert_rule_test:
      - eval_time: 20m
        alertname: SplunkHecIndeterminateDelivery
        exp_alerts:
          - exp_labels:
              severity: warning
              job: recsys-online-serving
            exp_annotations:
              summary: "Splunk delivery outcome unknown on recsys-online-serving"
              description: >-
                Batches were sent but never acknowledged, so Splunk may or may not hold
                them. Unlike dropped events these carry duplicate risk as well as loss risk.
                Usually a read timeout or a shutdown that outran its budget.

  # --- GatewayRegistryStale: fires above 120s, not below ---
  - interval: 1m
    input_series:
      - series: 'gateway_registry_snapshot_age_seconds{job="recsys-api-gateway"}'
        values: '200x20'
      - series: 'gateway_registry_snapshot_age_seconds{job="recsys-catalog-serving"}'
        values: '110x20'        # near miss: under the threshold
    alert_rule_test:
      - eval_time: 10m
        alertname: GatewayRegistryStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job: recsys-api-gateway
            exp_annotations:
              summary: "Gateway service-registry snapshot is stale or has never refreshed"
              description: >-
                The gateway is resolving upstreams from a registry snapshot older than two
                minutes, or has never completed a refresh since it started (reported as -1),
                so it may route to addresses that have moved. Check Redis availability and
                gateway_registry_refresh_failures_total.

  # --- GatewayRegistryStale: the -1 "never refreshed since startup" sentinel ---
  # GatewayRegistryMetrics.snapshotAgeSeconds returns -1 (not NaN, not absent) when
  # lastRefreshAtMs() == 0. `-1 > 120` is false, so without the explicit `== -1` branch this
  # series never fires no matter how long it holds -1 — proven by deleting that clause and
  # rerunning this file, which turns this case red.
  - interval: 1m
    input_series:
      - series: 'gateway_registry_snapshot_age_seconds{job="recsys-api-gateway"}'
        values: '-1x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: GatewayRegistryStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job: recsys-api-gateway
            exp_annotations:
              summary: "Gateway service-registry snapshot is stale or has never refreshed"
              description: >-
                The gateway is resolving upstreams from a registry snapshot older than two
                minutes, or has never completed a refresh since it started (reported as -1),
                so it may route to addresses that have moved. Check Redis availability and
                gateway_registry_refresh_failures_total.

  # --- OnlineServingShedding: fires above 0.1, not at 0.05 ---
  - interval: 1m
    input_series:
      - series: 'online_serving_rejected_rate{job="recsys-online-serving"}'
        values: '0.3x20'
      - series: 'online_serving_rejected_rate{job="recsys-catalog-serving"}'
        values: '0.05x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: OnlineServingShedding
        exp_alerts:
          - exp_labels:
              severity: warning
              job: recsys-online-serving
            exp_annotations:
              summary: "Online serving is shedding more than 10% of requests"
              description: >-
                Admission control has been rejecting a sustained share of traffic. Either
                genuine overload or too tight a concurrency limit — check
                recsys_load_shedder_utilization and the pod's CPU.

  # --- RedisCacheUnavailable ---
  - interval: 1m
    input_series:
      - series: 'redis_cache_available{job="recsys-catalog-serving"}'
        values: '1x5 0x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: RedisCacheUnavailable
        exp_alerts: []
      - eval_time: 12m
        alertname: RedisCacheUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
              job: recsys-catalog-serving
            exp_annotations:
              summary: "Redis is unreachable from recsys-catalog-serving"
              description: >-
                The cache probe cannot reach Redis. Serving degrades to stale or empty
                results depending on the path. Check the Redis pods and the NetworkPolicy
                egress rules.

  # --- RedisReplicaLagHigh: branch 1, high lag with a usable value ---
  - interval: 1m
    input_series:
      - series: 'redis_replica_lag_seconds{job="recsys-catalog-serving"}'
        values: '25x20'
      - series: 'redis_replica_lag_available{job="recsys-catalog-serving"}'
        values: '1x20'          # near miss for branch 2: probe is up
      - series: 'redis_replica_lag_seconds{job="recsys-online-serving"}'
        values: '2x20'          # near miss for branch 1: under the threshold
      - series: 'redis_replica_lag_available{job="recsys-online-serving"}'
        values: '1x20'          # near miss for branch 2: probe is up
    alert_rule_test:
      - eval_time: 15m
        alertname: RedisReplicaLagHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              job: recsys-catalog-serving
            exp_annotations:
              summary: "Redis replica lag above 10s or probe unavailable"
              description: >-
                AZ-aware replica reads are returning data more than ten seconds old, or the
                replica probe cannot determine lag at all. Reads routed to a replica may
                contradict a write that already succeeded. Check replica pod status and
                network connectivity between replicas.

  # --- RedisReplicaLagHigh: branch 2, probe unavailable with a real NaN lag value ---
  # This is the branch the expression gained: when the replica is fully unreachable the
  # lag gauge is still registered but reports NaN (the gauge is never absent — modeling
  # this as "no lag_seconds series at all" would test a premise that doesn't hold in
  # production). `redis_replica_lag_seconds > 10` is false for NaN in PromQL — verified by
  # dropping the `or redis_replica_lag_available == 0` branch and rerunning this file, which
  # turns this case red — so only that second branch catches it. Without this case that
  # branch is unproven.
  - interval: 1m
    input_series:
      - series: 'redis_replica_lag_seconds{job="recsys-model-serving"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'
      - series: 'redis_replica_lag_available{job="recsys-model-serving"}'
        values: '0x20'          # probe cannot reach the replica at all
    alert_rule_test:
      - eval_time: 15m
        alertname: RedisReplicaLagHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              job: recsys-model-serving
            exp_annotations:
              summary: "Redis replica lag above 10s or probe unavailable"
              description: >-
                AZ-aware replica reads are returning data more than ten seconds old, or the
                replica probe cannot determine lag at all. Reads routed to a replica may
                contradict a write that already succeeded. Check replica pod status and
                network connectivity between replicas.

  # --- OutboxBacklogGrowing: needs BOTH size and growth ---
  - interval: 1m
    input_series:
      - series: 'outbox_pending_events{job="recsys-model-serving"}'
        values: '1500+50x30'    # large AND growing -> fires
      - series: 'outbox_pending_events{job="recsys-catalog-serving"}'
        values: '2000+0x30'     # large but FLAT -> must not fire
    alert_rule_test:
      - eval_time: 20m
        alertname: OutboxBacklogGrowing
        exp_alerts:
          - exp_labels:
              severity: warning
              job: recsys-model-serving
            exp_annotations:
              summary: "Transactional outbox backlog is growing"
              description: >-
                More than 1000 events are pending and the backlog is still increasing, so
                the relay is not keeping up. Eventual consistency windows widen until it
                drains. Check outbox_delivery_failures_total and
                outbox_delivery_lag_seconds.

  # --- OnlineFeatureDataStale / OnlineFeatureDataCriticallyStale: thresholds and job scoping ---
  # The job selector is load-bearing, not decoration. Every process that builds a
  # ConsistencyMetrics registers the feature gauges, including the outbox relay — which runs no
  # sampler and so publishes a permanent age of 0 and availability of 0. Task 2 made the relay
  # scrapeable, so those series are now real. Unscoped expressions would alert on a process that
  # was never meant to observe the feature view. The relay series below prove the scoping holds.
  - interval: 1m
    input_series:
      - series: 'redis_feature_version_age_seconds{job="recsys-online-serving", instance="10.0.0.9:7010"}'
        values: '61x20'         # one second past the serve-stale window -> fires
      - series: 'redis_feature_version_age_seconds{job="recsys-outbox-relay", instance="10.0.0.5:7020"}'
        values: '900x20'        # a process with no sampler must never page this alert
    alert_rule_test:
      - eval_time: 15m
        alertname: OnlineFeatureDataStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job: recsys-online-serving
              instance: 10.0.0.9:7010
            exp_annotations:
              summary: "Online feature view older than 60s on 10.0.0.9:7010"
              description: >-
                The newest *:updated_at version in Redis is more than 60 seconds old, which is
                the whole stale-on-error budget OnlineFeatureStore is allowed to serve within.
                Recommendations are being built from a feature view that stopped advancing.
                Check the Flink online-feature job for a stalled or restarting task, then Kafka
                consumer lag on its source topics. See docs/runbooks/serving-data-freshness.md.
      - eval_time: 15m
        alertname: OnlineFeatureDataCriticallyStale
        exp_alerts: []          # 61 is nowhere near the critical threshold

  # Exactly at each threshold: `>` must not fire, or the SLO boundary is off by one.
  - interval: 1m
    input_series:
      - series: 'redis_feature_version_age_seconds{job="recsys-online-serving", instance="10.0.0.9:7010"}'
        values: '60x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: OnlineFeatureDataStale
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'redis_feature_version_age_seconds{job="recsys-online-serving", instance="10.0.0.9:7010"}'
        values: '300x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: OnlineFeatureDataCriticallyStale
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'redis_feature_version_age_seconds{job="recsys-online-serving", instance="10.0.0.9:7010"}'
        values: '301x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: OnlineFeatureDataCriticallyStale
        exp_alerts:
          - exp_labels:
              severity: critical
              job: recsys-online-serving
              instance: 10.0.0.9:7010
            exp_annotations:
              summary: "Online feature view older than 300s on 10.0.0.9:7010"
              description: >-
                The online feature view has been more than five minutes old for five minutes,
                far outside the 60-second window serving is designed to tolerate. Treat the
                recommendations being served as built from abandoned data. Check the Flink job
                and Kafka first, then whether Redis lost the feature keyspace entirely.
                See docs/runbooks/serving-data-freshness.md.

  # A brief spike must not page: the `for: 5m` hold is the only thing separating one slow
  # refresh from a stalled pipeline.
  - interval: 1m
    input_series:
      - series: 'redis_feature_version_age_seconds{job="recsys-online-serving", instance="10.0.0.9:7010"}'
        values: '10 10 90 90 10 10 10 10 10 10 10 10 10 10 10'
    alert_rule_test:
      - eval_time: 14m
        alertname: OnlineFeatureDataStale
        exp_alerts: []

  # --- OnlineFeatureVersionSampleUnavailable ---
  # The reason this alert exists at all: redis_feature_version_age_seconds initializes to 0 and
  # only moves on a successful sample, so a sampler that has never once reached Redis reads as
  # "0 seconds old" — indistinguishable from perfectly fresh — and OnlineFeatureDataStale can
  # never fire for it. This is the only rule that catches that state.
  - interval: 1m
    input_series:
      - series: 'redis_feature_version_sample_available{job="recsys-online-serving", instance="10.0.0.9:7010"}'
        values: '0x20'
      - series: 'redis_feature_version_age_seconds{job="recsys-online-serving", instance="10.0.0.9:7010"}'
        values: '0x20'          # the trap: looks maximally fresh, means nothing
      - series: 'redis_feature_version_sample_available{job="recsys-outbox-relay", instance="10.0.0.5:7020"}'
        values: '0x20'          # permanently 0 by construction; must never page
    alert_rule_test:
      - eval_time: 15m
        alertname: OnlineFeatureVersionSampleUnavailable
        exp_alerts:
          - exp_labels:
              severity: warning
              job: recsys-online-serving
              instance: 10.0.0.9:7010
            exp_annotations:
              summary: "Online feature version sampling is not succeeding on 10.0.0.9:7010"
              description: >-
                No feature-version sample has succeeded for five minutes, so
                redis_feature_version_age_seconds is frozen at its last good value and cannot be
                trusted as a freshness reading — a low age here is stale evidence, not fresh
                data. Either Redis is unreachable from online serving or no *:updated_at keys
                exist. See docs/runbooks/serving-data-freshness.md.
      - eval_time: 15m
        alertname: OnlineFeatureDataStale
        exp_alerts: []          # proves the frozen 0 age genuinely cannot page on its own

  - interval: 1m
    input_series:
      - series: 'redis_feature_version_sample_available{job="recsys-online-serving", instance="10.0.0.9:7010"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: OnlineFeatureVersionSampleUnavailable
        exp_alerts: []

  # --- OutboxDeliveryLatencyHigh ---
  # The series name is outbox_delivery_lag_seconds_max, NOT the meter name
  # outbox_delivery_lag_seconds: Micrometer exposes a Timer as _count/_sum/_max and the bare
  # name matches nothing. ConsistencyMetricsTest pins the exact scraped line so a Micrometer
  # upgrade that renames it fails there instead of silently disarming this alert.
  - interval: 1m
    input_series:
      - series: 'outbox_delivery_lag_seconds_max{job="recsys-outbox-relay", destination="kafka_online"}'
        values: '31x25'
      - series: 'outbox_delivery_lag_seconds_max{job="recsys-outbox-relay", destination="saga_sns"}'
        values: '120x25'        # a different destination with its own budget; not this SLO
    alert_rule_test:
      - eval_time: 20m
        alertname: OutboxDeliveryLatencyHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              job: recsys-outbox-relay
              destination: kafka_online
            exp_annotations:
              summary: "kafka_online outbox delivery slower than 30s"
              description: >-
                Durable online-event delivery has been taking longer than 30 seconds for ten
                minutes, so writes accepted by the API are reaching Kafka well outside the
                intended consistency window. Check relay logs, the MySQL outbox backlog
                (outbox_pending_events), and Kafka broker reachability from the relay.
                See docs/runbooks/serving-data-freshness.md.

  - interval: 1m
    input_series:
      - series: 'outbox_delivery_lag_seconds_max{job="recsys-outbox-relay", destination="kafka_online"}'
        values: '30x25'
    alert_rule_test:
      - eval_time: 20m
        alertname: OutboxDeliveryLatencyHigh
        exp_alerts: []

  # --- OutboxDeliveryFailuresSustained ---
  # Lookback is 5m under a 10m hold, deliberately shorter than the hold. recordDeliveryFailure
  # increments once per failed ATTEMPT, and the relay retries — so a single transient Kafka blip
  # is routine, not an incident. With a 10m lookback a lone increment would keep the expression
  # true for a full 10m and page on its own; a 5m lookback cannot span the 10m hold, so only
  # failures that keep arriving can fire this. The brief-burst case below is what proves it.
  - interval: 1m
    input_series:
      - series: 'outbox_delivery_failures_total{job="recsys-outbox-relay", destination="kafka_online"}'
        values: '0+2x30'        # failing continuously -> fires
    alert_rule_test:
      - eval_time: 25m
        alertname: OutboxDeliveryFailuresSustained
        exp_alerts:
          - exp_labels:
              severity: warning
              job: recsys-outbox-relay
              destination: kafka_online
            exp_annotations:
              summary: "kafka_online outbox deliveries are failing continuously"
              description: >-
                Delivery attempts to kafka_online have been failing without a break for ten
                minutes, so the relay is retrying rather than draining. Events remain durable in
                the MySQL outbox, but the consistency window widens for as long as this lasts,
                and events that exhaust the retry policy are marked dead. Check relay logs for
                the failure class and Kafka reachability.
                See docs/runbooks/serving-data-freshness.md.

  - interval: 1m
    input_series:
      - series: 'outbox_delivery_failures_total{job="recsys-outbox-relay", destination="kafka_online"}'
        values: '5x30'          # a flat counter is not a failing one
    alert_rule_test:
      - eval_time: 25m
        alertname: OutboxDeliveryFailuresSustained
        exp_alerts: []

  # A four-attempt burst that then stops — one flaky minute the relay retried through — must
  # not page. This is the case that pins the 5m lookback. A lookback window keeps increase()
  # positive for its own duration after the last increment, so with [10m] these four failures
  # hold the expression true from t=1 to t=12: twelve minutes, comfortably longer than the 10m
  # hold, and the alert fires spuriously at t=11. With [5m] the same burst holds it true only
  # to t=7, which cannot span the hold. Note the eval times — checking only a late t=25m would
  # miss the spurious alert entirely, since by then it has already resolved. Verified by
  # mutating the rule to [10m] and confirming this case turns red.
  - interval: 1m
    input_series:
      - series: 'outbox_delivery_failures_total{job="recsys-outbox-relay", destination="kafka_online"}'
        values: '0 1 2 3 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4'
    alert_rule_test:
      - eval_time: 11m
        alertname: OutboxDeliveryFailuresSustained
        exp_alerts: []
      - eval_time: 12m
        alertname: OutboxDeliveryFailuresSustained
        exp_alerts: []
      - eval_time: 13m
        alertname: OutboxDeliveryFailuresSustained
        exp_alerts: []
      - eval_time: 14m
        alertname: OutboxDeliveryFailuresSustained
        exp_alerts: []
      - eval_time: 25m
        alertname: OutboxDeliveryFailuresSustained
        exp_alerts: []

  # --- JvmHeapPressureHigh ---
  - interval: 1m
    input_series:
      # 95% used: must fire.
      - series: 'jvm_memory_used_bytes{area="heap", namespace="recsys", job="recsys-api-gateway", instance="10.0.0.1:8010", id="G1 Old Gen"}'
        values: '950000000x20'
      - series: 'jvm_memory_max_bytes{area="heap", namespace="recsys", job="recsys-api-gateway", instance="10.0.0.1:8010", id="G1 Old Gen"}'
        values: '1000000000x20'
      # 85% used: near-miss, must NOT fire.
      - series: 'jvm_memory_used_bytes{area="heap", namespace="recsys", job="recsys-online-serving", instance="10.0.0.2:7010", id="G1 Old Gen"}'
        values: '850000000x20'
      - series: 'jvm_memory_max_bytes{area="heap", namespace="recsys", job="recsys-online-serving", instance="10.0.0.2:7010", id="G1 Old Gen"}'
        values: '1000000000x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: JvmHeapPressureHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              job: recsys-api-gateway
              instance: 10.0.0.1:8010
            exp_annotations:
              summary: "recsys-api-gateway heap is above 90% used"
              description: >-
                Sustained heap pressure. Expect longer GC pauses and, past this, allocation
                stalls. Cross-check the Splunk heap-pressure events from the same service for
                what was running at the crossing. The `> 0` filter on jvm_memory_max_bytes is
                load-bearing: pools with no maximum report -1, and including them makes the
                ratio meaningless.

  # --- JvmHeapPressureHigh: a foreign JVM must never page recsys on-call ---
  # jvm_memory_used_bytes / jvm_memory_max_bytes are generic Micrometer/JMX metric names, not
  # unique to this repo -- any other workload the operator's Prometheus scrapes emits the same
  # names. Without namespace="recsys" scoping this alert this series would fire with
  # {{ $labels.job }} naming a service that isn't ours. Every other input series in this file
  # already carries a recsys job label, so this is the only case that can catch the scoping
  # being dropped: proven by removing `namespace="recsys"` from the alert expression and
  # rerunning this file, which turns this case red.
  - interval: 1m
    input_series:
      # 95% used, well above the threshold, but in a foreign namespace (and one series with no
      # namespace label at all): must NOT fire.
      - series: 'jvm_memory_used_bytes{area="heap", namespace="other-team", job="unrelated-service", instance="10.0.0.9:9090", id="G1 Old Gen"}'
        values: '950000000x20'
      - series: 'jvm_memory_max_bytes{area="heap", namespace="other-team", job="unrelated-service", instance="10.0.0.9:9090", id="G1 Old Gen"}'
        values: '1000000000x20'
      - series: 'jvm_memory_used_bytes{area="heap", job="no-namespace-service", instance="10.0.0.8:9090", id="G1 Old Gen"}'
        values: '950000000x20'
      - series: 'jvm_memory_max_bytes{area="heap", job="no-namespace-service", instance="10.0.0.8:9090", id="G1 Old Gen"}'
        values: '1000000000x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: JvmHeapPressureHigh
        exp_alerts: []

  # --- JvmHeapPressureHigh: the -1 sentinel must not poison the ratio ---
  # A pool with no maximum reports -1. Summed in naively alongside a real pool it drags the
  # denominator down and can make a healthy heap read as over 100% used, or produce a
  # negative denominator and a comparison that silently never fires. Same class of trap as
  # RedisReplicaLagHigh's NaN and GatewayRegistryStale's -1, both recorded in 18 section 8.4.
  #
  # Values are deliberately NOT byte-scale. At byte scale (1e9 max alongside a -1 pool) the
  # sentinel is one part in a billion of the denominator, so dropping the `> 0` filter barely
  # moves the ratio and this case cannot go red under mutation -- verified empirically: a first
  # draft using 1000000000/-1 stayed green with the filter removed, which is exactly the
  # "test that proves nothing" the brief warns about. Using max=2 makes -1 half the
  # denominator, so the filter's absence is provable: WITH the filter (only the real-max pool
  # counted) the ratio is 1/2 = 0.5, correctly no fire. WITHOUT it, sum(max) collapses to
  # 2 + (-1) = 1 and the ratio becomes 1/1 = 1.0, spuriously > 0.90 -- a healthy 50%-used heap
  # reading as maxed out. Confirmed by removing the `> 0` filter and rerunning: this case turns
  # red (see task-7-report.md).
  - interval: 1m
    input_series:
      # 50% used against the pool that HAS a max: must not fire.
      - series: 'jvm_memory_used_bytes{area="heap", namespace="recsys", job="recsys-catalog-serving", instance="10.0.0.3:6010", id="G1 Old Gen"}'
        values: '1x20'
      - series: 'jvm_memory_max_bytes{area="heap", namespace="recsys", job="recsys-catalog-serving", instance="10.0.0.3:6010", id="G1 Old Gen"}'
        values: '2x20'
      - series: 'jvm_memory_used_bytes{area="heap", namespace="recsys", job="recsys-catalog-serving", instance="10.0.0.3:6010", id="G1 Eden Space"}'
        values: '0x20'
      - series: 'jvm_memory_max_bytes{area="heap", namespace="recsys", job="recsys-catalog-serving", instance="10.0.0.3:6010", id="G1 Eden Space"}'
        values: '-1x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: JvmHeapPressureHigh
        exp_alerts: []

  # --- JvmGcTimeFractionHigh ---
  - interval: 1m
    input_series:
      # 0.2s of pause per second of wall time: must fire.
      - series: 'jvm_gc_pause_seconds_sum{namespace="recsys", job="recsys-online-serving", instance="10.0.0.2:7010", action="end of minor GC", cause="G1 Evacuation Pause"}'
        values: '0+12x25'
      # 0.05s per second: near-miss, must NOT fire.
      - series: 'jvm_gc_pause_seconds_sum{namespace="recsys", job="recsys-catalog-serving", instance="10.0.0.3:6010", action="end of minor GC", cause="G1 Evacuation Pause"}'
        values: '0+3x25'
    alert_rule_test:
      - eval_time: 20m
        alertname: JvmGcTimeFractionHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              job: recsys-online-serving
              instance: 10.0.0.2:7010
            exp_annotations:
              summary: "recsys-online-serving is spending over 10% of wall time in GC pause"
              description: >-
                More than a tenth of elapsed time is stop-the-world pause, which shows up
                directly as request latency. Check JvmHeapPressureHigh on the same instance
                first — this is usually its consequence, not an independent fault.

  # --- JvmGcTimeFractionHigh: a foreign JVM must never page recsys on-call ---
  # jvm_gc_pause_seconds_sum is a generic Micrometer JVM metric name, same reasoning as the
  # JvmHeapPressureHigh foreign-namespace case above. Proven by removing `namespace="recsys"`
  # from the alert expression and rerunning this file, which turns this case red.
  - interval: 1m
    input_series:
      # 0.2s of pause per second of wall time, well above the threshold, but in a foreign
      # namespace: must NOT fire.
      - series: 'jvm_gc_pause_seconds_sum{namespace="other-team", job="unrelated-service", instance="10.0.0.9:9090", action="end of minor GC", cause="G1 Evacuation Pause"}'
        values: '0+12x25'
    alert_rule_test:
      - eval_time: 20m
        alertname: JvmGcTimeFractionHigh
        exp_alerts: []

  # --- JvmGcTimeFractionHigh: a short burst must NOT fire ---
  # for: (10m) deliberately exceeds the rate() range (5m) -- see the comment on the alert
  # itself. That is only safe if a burst shorter than roughly the range genuinely fails to
  # hold the expression true for the full 10m. The counter jumps +12/min for 3 steps (t=0..3)
  # then goes flat.
  #
  # A first pass at this comment worked the rate() value out by hand from the raw counter
  # slope and got it wrong -- naive slope math ignores Prometheus's actual extrapolation
  # behavior at range-vector boundaries. The real values, pulled with promtool's
  # `promql_expr_test` (which evaluates the bare expression instead of the alert, so the
  # actual computed number can be read off directly) rather than guessed:
  #   t=1m: 0.04/s   t=2m: 0.08/s   t=3m: 0.12/s   t=4m: 0.12/s
  #   t=5m: 0.10/s (exactly the threshold -- `> 0.10` is false)   t=6m: 0.05/s   t=7m+: 0
  # So the condition is only ever true at t=3m and t=4m -- a two-minute stretch, not five --
  # nowhere near enough to satisfy a 10m hold. Confirmed both ways: mutating for: to 1m makes
  # this exact series fire at t=4m (pending since t=3m, satisfied one minute later) and
  # resolve again by t=6m once the rate drops back under 0.10, proving the profile above is
  # real and this case is not vacuously green. With the real for: 10m, checked at multiple
  # eval times including well past t=13m (when a sustained version of this same profile would
  # have fired), to prove it never transiently fires either.
  - interval: 1m
    input_series:
      - series: 'jvm_gc_pause_seconds_sum{namespace="recsys", job="recsys-catalog-serving", instance="10.0.0.4:6010", action="end of minor GC", cause="G1 Evacuation Pause"}'
        values: '0 12 24 36 36 36 36 36 36 36 36 36 36 36 36 36 36 36 36 36 36 36 36 36 36'
    alert_rule_test:
      - eval_time: 6m
        alertname: JvmGcTimeFractionHigh
        exp_alerts: []
      - eval_time: 10m
        alertname: JvmGcTimeFractionHigh
        exp_alerts: []
      - eval_time: 13m
        alertname: JvmGcTimeFractionHigh
        exp_alerts: []
      - eval_time: 15m
        alertname: JvmGcTimeFractionHigh
        exp_alerts: []
      - eval_time: 20m
        alertname: JvmGcTimeFractionHigh
        exp_alerts: []

  # --- RequestLatencyP99High: online serving fires at 0.4, not the 1s the others get ---
  # Its requestTimeoutMillis default is 500ms, so a threshold at or above 0.5 there could
  # never fire: the histogram is bounded by the timeout. promtool cannot detect an
  # unreachable threshold — an alert that can never fire passes a near-miss case perfectly.
  - interval: 1m
    input_series:
      # All observations in the 0.5s bucket: p99 lands at 0.5 > 0.4, must fire.
      - series: 'online_serving_request_duration_seconds_bucket{le="0.1", job="recsys-online-serving"}'
        values: '0+0x25'
      - series: 'online_serving_request_duration_seconds_bucket{le="0.5", job="recsys-online-serving"}'
        values: '0+100x25'
      - series: 'online_serving_request_duration_seconds_bucket{le="+Inf", job="recsys-online-serving"}'
        values: '0+100x25'
    alert_rule_test:
      - eval_time: 20m
        alertname: RequestLatencyP99High
        exp_alerts:
          - exp_labels:
              severity: warning
              job: recsys-online-serving
            exp_annotations:
              summary: "recsys-online-serving p99 request latency is above its budget"
              description: >-
                Search Splunk for the same window with outcome=slow to see which routes and
                which requests. Thresholds differ per service and are bound to each one's
                enforced request timeout: online serving caps requests at 500ms
                (ONLINE_REQUEST_TIMEOUT_MS), so a threshold at or above 0.5 there could never
                fire. If a service gains or changes an explicit request timeout, its threshold
                must move with it.

  # --- RequestLatencyP99High: catalog-serving branch fire case ---
  # Isolates the catalog-serving arm of the `or` expression. Without this, a typo'd metric
  # name or an unreachable threshold on that branch would stay invisible: the suite would stay
  # green purely because the online-serving branch's own fire case happens to pass.
  - interval: 1m
    input_series:
      # All observations land in (1, 2]: p99 interpolates to ~1.99 > 1, must fire.
      - series: 'catalog_serving_request_duration_seconds_bucket{le="1", job="recsys-catalog-serving"}'
        values: '0+0x25'
      - series: 'catalog_serving_request_duration_seconds_bucket{le="2", job="recsys-catalog-serving"}'
        values: '0+100x25'
      - series: 'catalog_serving_request_duration_seconds_bucket{le="+Inf", job="recsys-catalog-serving"}'
        values: '0+100x25'
    alert_rule_test:
      - eval_time: 20m
        alertname: RequestLatencyP99High
        exp_alerts:
          - exp_labels:
              severity: warning
              job: recsys-catalog-serving
            exp_annotations:
              summary: "recsys-catalog-serving p99 request latency is above its budget"
              description: >-
                Search Splunk for the same window with outcome=slow to see which routes and
                which requests. Thresholds differ per service and are bound to each one's
                enforced request timeout: online serving caps requests at 500ms
                (ONLINE_REQUEST_TIMEOUT_MS), so a threshold at or above 0.5 there could never
                fire. If a service gains or changes an explicit request timeout, its threshold
                must move with it.

  # --- RequestLatencyP99High: gateway branch fire case ---
  # Isolates the api-gateway arm of the `or` expression, the same way the block above isolates
  # catalog-serving. Together with the pre-existing online-serving fire case, all three branches
  # now each have at least one input that proves they can independently fire.
  - interval: 1m
    input_series:
      # All observations land in (2, 5]: p99 interpolates to ~4.97 > 2, must fire.
      - series: 'api_gateway_request_duration_seconds_bucket{le="2", job="recsys-api-gateway"}'
        values: '0+0x25'
      - series: 'api_gateway_request_duration_seconds_bucket{le="5", job="recsys-api-gateway"}'
        values: '0+100x25'
      - series: 'api_gateway_request_duration_seconds_bucket{le="+Inf", job="recsys-api-gateway"}'
        values: '0+100x25'
    alert_rule_test:
      - eval_time: 20m
        alertname: RequestLatencyP99High
        exp_alerts:
          - exp_labels:
              severity: warning
              job: recsys-api-gateway
            exp_annotations:
              summary: "recsys-api-gateway p99 request latency is above its budget"
              description: >-
                Search Splunk for the same window with outcome=slow to see which routes and
                which requests. Thresholds differ per service and are bound to each one's
                enforced request timeout: online serving caps requests at 500ms
                (ONLINE_REQUEST_TIMEOUT_MS), so a threshold at or above 0.5 there could never
                fire. If a service gains or changes an explicit request timeout, its threshold
                must move with it.

  # --- RequestLatencyP99High near-miss: everything fast, must NOT fire ---
  - interval: 1m
    input_series:
      - series: 'online_serving_request_duration_seconds_bucket{le="0.1", job="recsys-online-serving"}'
        values: '0+100x25'
      - series: 'online_serving_request_duration_seconds_bucket{le="0.5", job="recsys-online-serving"}'
        values: '0+100x25'
      - series: 'online_serving_request_duration_seconds_bucket{le="+Inf", job="recsys-online-serving"}'
        values: '0+100x25'
      - series: 'api_gateway_request_duration_seconds_bucket{le="1", job="recsys-api-gateway"}'
        values: '0+100x25'
      - series: 'api_gateway_request_duration_seconds_bucket{le="2", job="recsys-api-gateway"}'
        values: '0+100x25'
      - series: 'api_gateway_request_duration_seconds_bucket{le="+Inf", job="recsys-api-gateway"}'
        values: '0+100x25'
    alert_rule_test:
      - eval_time: 20m
        alertname: RequestLatencyP99High
        exp_alerts: []
