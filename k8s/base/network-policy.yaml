# API gateway: accepts external traffic on 8010 and Prometheus; egress to serving pods and DNS only.
# NLB in ip-target mode sends packets directly to pod IPs, so NetworkPolicy applies.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: recsys-api-gateway
  namespace: recsys
spec:
  podSelector:
    matchLabels:
      app: recsys-api-gateway
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: 8010
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 8010
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: recsys-catalog-serving
      ports:
        - port: 6010
    - to:
        - podSelector:
            matchLabels:
              app: recsys-model-serving
      ports:
        - port: 8080
    - to:
        - podSelector:
            matchLabels:
              app: recsys-online-serving
      ports:
        - port: 7010
    # REDIS_MODE is "sentinel" in the base ConfigMap, so every Redis client discovers the
    # primary through the sentinels before it ever connects on 6379. Sentinel pods carry
    # app: redis-sentinel, a different label from the redis primary/replica pods, so the
    # 6379 rule above does not cover them.
    - to:
        - podSelector:
            matchLabels:
              app: redis-sentinel
      ports:
        - port: 26379
    # The LLM explanation proxy. LLM_SERVICE_URL / LLM_EXPLANATION_SERVICE_URL both point here.
    - to:
        - podSelector:
            matchLabels:
              app: ollama
      ports:
        - port: 11434
    # SERVICE_REGISTRY_ENABLED=true makes the gateway resolve upstreams from Redis. Added
    # unconditionally even though the flag defaults off: the registry falls back to the static
    # route address when Redis is unreachable, so a blocked connection degrades silently
    # rather than failing, and nobody would find this from the symptom.
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
    # Scoped to kube-system rather than left destination-free. A rule with no `to[]` permits
    # port 53 to ANY address, inside the cluster or out, which is a tunnel through an otherwise
    # tight allow-list. Namespace rather than `podSelector: k8s-app=kube-dns` on purpose:
    # NodeLocal DNSCache is host-networked and a podSelector may not match it on every CNI, and
    # the cost of over-tightening here is every DNS lookup dropped — a total outage on a control
    # nobody has confirmed the cluster even enforces.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# Catalog serving: ingress from gateway only; egress to Redis and DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: recsys-catalog-serving
  namespace: recsys
spec:
