---
# Online serving: ingress from gateway and Prometheus; egress to Redis and DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: recsys-online-serving
  namespace: recsys
spec:
  podSelector:
    matchLabels:
      app: recsys-online-serving
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: recsys-api-gateway
      ports:
        - port: 7010
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 7010
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
    # REDIS_MODE is "sentinel" in the base ConfigMap, so every Redis client discovers the
    # primary through the sentinels before it ever connects on 6379. Sentinel pods carry
    # app: redis-sentinel, a different label from the redis primary/replica pods, so the
    # 6379 rule above does not cover them.
    - to:
        - podSelector:
            matchLabels:
              app: redis-sentinel
      ports:
        - port: 26379
    # Outbox rows when MYSQL_ENABLED=true. Added unconditionally for the same reason as the
    # gateway's Redis rule — a policy that has to be edited in the same change as the flag is
    # a policy that will not be.
    - to:
        - podSelector:
            matchLabels:
              app: mysql
      ports:
        - port: 3306
    # Scoped to kube-system rather than left destination-free. A rule with no `to[]` permits
    # port 53 to ANY address, inside the cluster or out, which is a tunnel through an otherwise
    # tight allow-list. Namespace rather than `podSelector: k8s-app=kube-dns` on purpose:
    # NodeLocal DNSCache is host-networked and a podSelector may not match it on every CNI, and
    # the cost of over-tightening here is every DNS lookup dropped — a total outage on a control
    # nobody has confirmed the cluster even enforces.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# Outbox relay: ingress from Prometheus only. Nothing else in the cluster calls the relay —
# 7020 serves /metrics and the two health probes, not request traffic.
#
# Ingress-only on purpose. The relay's whole job is reaching MySQL and Kafka (and, in EKS,
# ElastiCache), so declaring policyTypes: [Ingress] leaves egress unrestricted rather than
# black-holing delivery the moment this file lands. Kubelet probes originate from the node
# rather than a pod and are not matched by any `from` selector here; they pass for the same
# CNI reason the four services above already depend on.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: recsys-outbox-relay
  namespace: recsys
spec:
  podSelector:
    matchLabels:
      app: recsys-outbox-relay
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 7020
---
# Redis: ingress from serving pods only; no egress needed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis
  namespace: recsys
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: recsys-catalog-serving
        - podSelector:
            matchLabels:
              app: recsys-model-serving
        - podSelector:
            matchLabels:
              app: recsys-online-serving
        # The gateway reads svc:registry:* when SERVICE_REGISTRY_ENABLED=true. Its egress rule
        # alone would not be enough: both ends of a NetworkPolicy are enforced independently.
        - podSelector:
            matchLabels:
              app: recsys-api-gateway
        # Replicas dial the primary for `--replicaof`, and both carry app: redis — this policy
        # selects them, so without a rule admitting itself the replication stream is dropped.
        - podSelector:
            matchLabels:
              app: redis
        # Sentinels monitor the primary and discover replicas on 6379. Without this they never
        # reach quorum, and REDIS_MODE: sentinel is the base default.
        - podSelector:
            matchLabels:
              app: redis-sentinel
      ports:
        - port: 6379
---
# Redis Sentinel: ingress from the four workloads that discover Redis through it, plus the
# sentinels themselves. Until this existed the sentinel pods matched no policy, so Kubernetes
# admitted every source in the cluster — the redis policy above selects app: redis, and these
# pods carry app: redis-sentinel. A sentinel decides which node clients treat as primary, so
# an unrestricted one is a redirection primitive, not just an information leak.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-sentinel
  namespace: recsys
spec:
  podSelector:
    matchLabels:
      app: redis-sentinel
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: recsys-api-gateway
        - podSelector:
            matchLabels:
              app: recsys-catalog-serving
        - podSelector:
            matchLabels:
              app: recsys-model-serving
        - podSelector:
            matchLabels:
              app: recsys-online-serving
        # Sentinels gossip to agree on a primary; without this they never reach quorum.
        - podSelector:
            matchLabels:
              app: redis-sentinel
      ports:
        - port: 26379
