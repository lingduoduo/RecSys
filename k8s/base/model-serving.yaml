apiVersion: apps/v1
kind: Deployment
metadata:
  name: recsys-model-serving
  namespace: recsys
  labels:
    app: recsys-model-serving
spec:
  replicas: 2
  selector:
    matchLabels:
      app: recsys-model-serving
  template:
    metadata:
      labels:
        app: recsys-model-serving
      annotations:
        # Annotation-based scraping disabled — ServiceMonitor (k8s/base/servicemonitor.yaml) is the authoritative discovery path.
        # Set to "true" only in environments without the Prometheus Operator.
        prometheus.io/scrape: "false"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: recsys-model-serving
      containers:
        - name: model-serving
          image: recsys-backend-service:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: recsys-config
          env:
            - name: RECSYS_MAIN_CLASS
              value: com.recsys.modelbased.model.ModelApplication
            - name: SERVER_PORT
              value: "8080"
            - name: JAVA_OPTS
              value: "-Xms1g -Xmx2g -XX:MaxDirectMemorySize=512m"
            - name: MANAGEMENT_ENDPOINTS_EXPOSURE
              value: "health,info,prometheus"
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            failureThreshold: 18
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 3Gi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: recsys-model-serving
  namespace: recsys
spec:
  type: ClusterIP
  selector:
    app: recsys-model-serving
  ports:
    - name: http
      port: 8080
      targetPort: http
