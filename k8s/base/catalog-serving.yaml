apiVersion: apps/v1
kind: Deployment
metadata:
  name: recsys-catalog-serving
  namespace: recsys
  labels:
    app: recsys-catalog-serving
spec:
  replicas: 2
  selector:
    matchLabels:
      app: recsys-catalog-serving
  template:
    metadata:
      labels:
        app: recsys-catalog-serving
    spec:
      containers:
        - name: catalog-serving
          image: recsys-backend-service:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: recsys-config
          env:
            - name: RECSYS_MAIN_CLASS
              value: com.recsys.serving.RecSysServer
            - name: PORT
              value: "6010"
            - name: JAVA_OPTS
              value: "-Xms512m -Xmx1g"
          ports:
            - name: http
              containerPort: 6010
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1536Mi
---
apiVersion: v1
kind: Service
metadata:
  name: recsys-catalog-serving
  namespace: recsys
spec:
  type: ClusterIP
  selector:
    app: recsys-catalog-serving
  ports:
    - name: http
      port: 6010
      targetPort: http
