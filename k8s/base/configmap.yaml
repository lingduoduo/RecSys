apiVersion: v1
kind: ConfigMap
metadata:
  name: recsys-config
  namespace: recsys
data:
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  CATALOG_SERVICE_URL: "http://recsys-catalog-serving:6010"
  MODEL_SERVICE_URL: "http://recsys-model-serving:8080"
  ONLINE_SERVICE_URL: "http://recsys-online-serving:7010"
  GATEWAY_TIMEOUT_MS: "3000"
  SPRING_APPLICATION_NAME: "recsys-model-serving"
  RECSYS_RECOMMENDATION_CACHE_ENABLED: "true"
  RECSYS_RECOMMENDATION_CACHE_TTL_SECONDS: "300"
  RECSYS_RECOMMENDATION_CACHE_MAX_ENTRIES: "10000"
  RECSYS_HEALTH_MAX_CONCURRENT_REQUESTS: "64"
  RECSYS_HEALTH_MAX_IN_FLIGHT_UTILIZATION: "0.95"
