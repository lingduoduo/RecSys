apiVersion: v1
kind: ConfigMap
metadata:
  name: recsys-config
  namespace: recsys
data:
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_MODE: "sentinel"
  REDIS_SENTINEL_MASTER: "mymaster"
  REDIS_SENTINEL_NODES: "redis-sentinel-0.redis-sentinel-headless.recsys.svc.cluster.local:26379,redis-sentinel-1.redis-sentinel-headless.recsys.svc.cluster.local:26379,redis-sentinel-2.redis-sentinel-headless.recsys.svc.cluster.local:26379"
  CATALOG_SERVICE_URL: "http://recsys-catalog-serving:6010"
  MODEL_SERVICE_URL: "http://recsys-model-serving:8080"
  ONLINE_SERVICE_URL: "http://recsys-online-serving:7010"
  USER_PROFILE_SERVICE_URL: "http://recsys-catalog-serving:6010"
  MOVIE_METADATA_SERVICE_URL: "http://recsys-catalog-serving:6010"
  FEATURE_SERVICE_URL: "http://recsys-online-serving:7010"
  RECOMMENDATION_RETRIEVAL_SERVICE_URL: "http://recsys-model-serving:8080"
  RANKING_SERVICE_URL: "http://recsys-model-serving:8080"
  LLM_SERVICE_URL: "http://ollama:11434"
  LLM_EXPLANATION_SERVICE_URL: "http://ollama:11434"
  AGENT_WORKFLOW_SERVICE_URL: "http://recsys-model-serving:8080"
  OBSERVABILITY_SERVICE_URL: "http://recsys-model-serving:8080"
  GATEWAY_TIMEOUT_MS: "3000"
  # Optional API-key auth. Keep unset by default; inject via Secret in production:
  # GATEWAY_API_KEYS: "replace-with-secret"
  GATEWAY_PUBLIC_PATHS: "/health"
  SPRING_APPLICATION_NAME: "recsys-model-serving"
  RECSYS_RECOMMENDATION_CACHE_ENABLED: "true"
  RECSYS_RECOMMENDATION_CACHE_TTL_SECONDS: "300"
  RECSYS_RECOMMENDATION_CACHE_MAX_ENTRIES: "10000"
  RECSYS_HEALTH_MAX_CONCURRENT_REQUESTS: "64"
  RECSYS_HEALTH_MAX_IN_FLIGHT_UTILIZATION: "0.95"
  # Gateway local rate limiting (token-bucket, per gateway replica).
  # Set MODEL_RPS lower: ONNX inference is CPU-heavy and cannot absorb the same burst.
  GATEWAY_RATE_LIMIT_RPS: "100"
  GATEWAY_RATE_LIMIT_BURST: "200"
  GATEWAY_RATE_LIMIT_MODEL_RPS: "50"
  GATEWAY_RATE_LIMIT_MODEL_BURST: "100"
  # Gateway circuit-breaker thresholds (shared across all routes).
  GATEWAY_CB_FAILURE_THRESHOLD: "5"
  GATEWAY_CB_COOLDOWN_MS: "10000"
  # Online-serving Redis rate limiter (cross-instance, fixed-window).
  ONLINE_REDIS_RATE_LIMIT_QPS: "200"
  ONLINE_REDIS_RATE_LIMIT_WINDOW_SECONDS: "1"
