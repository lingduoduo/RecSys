# Sentinel config template (read-only mount; init container copies to writable emptyDir)
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-sentinel-config
  namespace: recsys
data:
  sentinel-template.conf: |
    sentinel monitor mymaster redis-primary 6379 2
    sentinel down-after-milliseconds mymaster 5000
    sentinel failover-timeout mymaster 30000
    sentinel parallel-syncs mymaster 1
    sentinel auth-pass mymaster __REDIS_PASSWORD__
---
apiVersion: v1
kind: Service
metadata:
  name: redis-primary-headless
  namespace: recsys
spec:
  clusterIP: None
  selector:
    app: redis
    role: primary
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
# Primary StatefulSet — 1 replica with RDB snapshots and a PVC for /data
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-primary
  namespace: recsys
spec:
  serviceName: redis-primary-headless
  replicas: 1
  selector:
    matchLabels:
      app: redis
      role: primary
  template:
    metadata:
      labels:
        app: redis
        role: primary
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: redis
                topologyKey: topology.kubernetes.io/zone
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - "--save"
            - "900 1"
            - "--save"
            - "300 10"
            - "--save"
            - "60 10000"
            - "--maxmemory"
            - "200mb"
            # volatile-lru, not allkeys: everything cache-like carries an explicit TTL, so
            # the no-TTL keys are the authoritative ones (shard:topology, seeded
            # embeddings). Evicting those silently resets a resharded cluster to
            # generation 1. Memory pressure must degrade the cache and then fail loudly,
            # not corrupt state.
            - "--maxmemory-policy"
            - "volatile-lru"
            - "--dir"
            - "/data"
            - "--requirepass"
            - "$(REDIS_PASSWORD)"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: recsys-secrets
                  key: redis-password
                  optional: true
            # redis-cli reads REDISCLI_AUTH from the environment. A -a flag on the probe command
            # would put the password in the process table and in probe failure output.
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: recsys-secrets
                  key: redis-password
                  optional: true
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-primary-data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 384Mi
  volumeClaimTemplates:
    - metadata:
        name: redis-primary-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-primary
  namespace: recsys
spec:
  type: ClusterIP
  selector:
    app: redis
    role: primary
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-replica-headless
  namespace: recsys
spec:
  clusterIP: None
  selector:
    app: redis
    role: replica
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
# Replica StatefulSet — 2 replicas spread across AZs; no PVC (rebuilt from primary)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-replica
  namespace: recsys
spec:
  serviceName: redis-replica-headless
  replicas: 2
  selector:
    matchLabels:
      app: redis
      role: replica
  template:
    metadata:
      labels:
        app: redis
        role: replica
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: redis
                topologyKey: topology.kubernetes.io/zone
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - "--replicaof"
            - "redis-primary"
            - "6379"
            - "--maxmemory"
            - "200mb"
            # volatile-lru, not allkeys: everything cache-like carries an explicit TTL, so
            # the no-TTL keys are the authoritative ones (shard:topology, seeded
            # embeddings). Evicting those silently resets a resharded cluster to
            # generation 1. Memory pressure must degrade the cache and then fail loudly,
            # not corrupt state.
            - "--maxmemory-policy"
            - "volatile-lru"
            - "--requirepass"
            - "$(REDIS_PASSWORD)"
            # The replica authenticates TO the primary with this. Without it the replication
            # stream is rejected and the replica serves indefinitely stale reads rather than
            # failing — the most expensive way for this change to go wrong.
            - "--masterauth"
            - "$(REDIS_PASSWORD)"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: recsys-secrets
                  key: redis-password
                  optional: true
            # redis-cli reads REDISCLI_AUTH from the environment. A -a flag on the probe command
            # would put the password in the process table and in probe failure output.
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: recsys-secrets
                  key: redis-password
                  optional: true
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-replica
  namespace: recsys
spec:
  type: ClusterIP
  selector:
    app: redis
    role: replica
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel-headless
  namespace: recsys
spec:
  clusterIP: None
  selector:
    app: redis-sentinel
  ports:
    - name: sentinel
      port: 26379
      targetPort: 26379
---
# Sentinel StatefulSet — 3 replicas; init container copies config to writable emptyDir
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-sentinel
  namespace: recsys
spec:
  serviceName: redis-sentinel-headless
  replicas: 3
  selector:
    matchLabels:
      app: redis-sentinel
  template:
    metadata:
      labels:
        app: redis-sentinel
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: redis-sentinel
                topologyKey: topology.kubernetes.io/zone
      initContainers:
        - name: copy-sentinel-config
          image: redis:7-alpine
          # sed rather than cp: the template lives in a ConfigMap, which cannot hold the password,
          # so the placeholder is substituted from the environment at startup.
          command:
            - sh
            - -c
            - sed "s|__REDIS_PASSWORD__|$REDIS_PASSWORD|" /etc/redis/sentinel-template.conf > /data/sentinel.conf
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: recsys-secrets
                  key: redis-password
                  optional: true
          volumeMounts:
            - name: sentinel-config-template
              mountPath: /etc/redis
            - name: sentinel-data
              mountPath: /data
      containers:
        - name: sentinel
          image: redis:7-alpine
          command: ["redis-sentinel", "/data/sentinel.conf"]
          env:
            # redis-cli reads REDISCLI_AUTH from the environment. A -a flag on the probe command
            # would put the password in the process table and in probe failure output.
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: recsys-secrets
                  key: redis-password
                  optional: true
          ports:
            - containerPort: 26379
          volumeMounts:
            - name: sentinel-data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "-p", "26379", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "-p", "26379", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: sentinel-config-template
          configMap:
            name: redis-sentinel-config
        - name: sentinel-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel
  namespace: recsys
spec:
  type: ClusterIP
  selector:
    app: redis-sentinel
  ports:
    - name: sentinel
      port: 26379
      targetPort: 26379
---
# REDIS_HOST is "redis" in the ConfigMap, but until this Service existed that name resolved to
# nothing in-cluster. It was inert only because REDIS_MODE is "sentinel", so
# LettuceClientFactory takes the sentinel path and ignores the standalone host. The EKS
# overlays set REDIS_SENTINEL_MASTER: "" and rely on REDIS_HOST, so the standalone path IS
# live in production — and any base-shaped deployment that flips REDIS_MODE would fail on DNS
# resolution before NetworkPolicy ever entered the picture.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: recsys
spec:
  type: ClusterIP
  selector:
    app: redis
    # Primary only. REDIS_HOST is the standalone path's read-AND-write endpoint, and `app: redis`
    # alone also matches the two replicas — writes would round-robin onto a read-only replica and
    # fail intermittently, which is a worse failure than the DNS error this Service replaced.
    role: primary
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
