apiVersion: apps/v1
kind: Deployment
metadata:
  name: recsys-online-serving
  namespace: recsys
  labels:
    app: recsys-online-serving
spec:
  replicas: 2
  selector:
    matchLabels:
      app: recsys-online-serving
  template:
    metadata:
      labels:
        app: recsys-online-serving
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "7010"
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: recsys-online-serving
      containers:
        - name: online-serving
          image: recsys-backend-service:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: recsys-config
          env:
            - name: RECSYS_MAIN_CLASS
              value: com.recsys.api.online.OnlinePredictionServer
            - name: ONLINE_DEMO_PORT
              value: "7010"
            - name: ONLINE_EVENTS_SQS_ENABLED
              value: "false"
            - name: ONLINE_EVENTS_SQS_QUEUE_URL
              value: ""
            - name: REDIS_POOL_MAX_TOTAL
              value: "64"
            - name: REDIS_POOL_MAX_IDLE
              value: "16"
            - name: REDIS_POOL_MIN_IDLE
              value: "4"
            - name: REDIS_POOL_MAX_WAIT_MS
              value: "100"
            - name: REDIS_TIMEOUT_MS
              value: "200"
            - name: JAVA_OPTS
              value: "-Xms512m -Xmx1g"
          ports:
            - name: http
              containerPort: 7010
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            failureThreshold: 24
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1536Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: recsys-online-serving
  namespace: recsys
spec:
  type: ClusterIP
  selector:
    app: recsys-online-serving
  ports:
    - name: http
      port: 7010
      targetPort: http
