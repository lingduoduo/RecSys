apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: recsys-model-serving
  namespace: recsys
  labels:
    app: recsys-model-serving
spec:
  selector:
    matchLabels:
      app: recsys-model-serving
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
      scheme: http
