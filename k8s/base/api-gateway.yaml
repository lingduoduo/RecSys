apiVersion: apps/v1
kind: Deployment
metadata:
  name: recsys-api-gateway
  namespace: recsys
  labels:
    app: recsys-api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: recsys-api-gateway
  template:
    metadata:
      labels:
        app: recsys-api-gateway
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: recsys-api-gateway
      containers:
        - name: api-gateway
          image: recsys-backend-service:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: recsys-config
          env:
            - name: RECSYS_MAIN_CLASS
              value: com.recsys.api.gateway.MicroserviceGatewayServer
            - name: GATEWAY_PORT
              value: "8010"
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m"
            # Origin lockdown. Absent until the CDN rollout reaches step 4, at which point the
            # Secret is created out-of-band (docs/runbooks/cdn-operations.md). optional: true keeps
            # the pod schedulable before then and in local/base deploys with no CDN.
            - name: GATEWAY_ORIGIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: recsys-gateway-origin-secret
                  key: secret
                  optional: true
            # Splunk HEC log shipping. Inert until the recsys-splunk Secret exists, so
            # optional: true keeps pods schedulable before it is provisioned — same pattern
            # as recsys-online-admin / SHARD_ADMIN_TOKEN. See
            # docs/runbooks/splunk-hec-logging.md.
            - name: SPLUNK_SERVICE_NAME
              value: "api-gateway"
            - name: SPLUNK_HEC_URL
              value: "http://splunk:8088/services/collector/event"
            - name: SPLUNK_HEC_TOKEN
              valueFrom:
                secretKeyRef:
                  name: recsys-splunk
                  key: hec-token
                  optional: true
            # Redis AUTH. optional: true keeps the pod schedulable before the Secret exists —
            # LettuceClientFactory then refuses to start with a message naming this key, which is
            # a readable failure rather than a pod stuck Pending with an empty log.
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: recsys-secrets
                  key: redis-password
                  optional: true
          ports:
            - name: http
              containerPort: 8010
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 24
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 750m
              memory: 768Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: recsys-api-gateway
  namespace: recsys
  # ServiceMonitor.spec.selector matches THESE labels — not spec.selector below, which
  # selects pods. Without them the ServiceMonitor matches nothing and scrapes nothing.
  labels:
    app: recsys-api-gateway
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: HTTP
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: /health
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-port: "8010"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-interval: "10"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-healthy-threshold: "2"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-unhealthy-threshold: "2"
    service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: deregistration_delay.timeout_seconds=30
spec:
  type: LoadBalancer
  selector:
    app: recsys-api-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
