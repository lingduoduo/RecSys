apiVersion: apps/v1
kind: Deployment
metadata:
  name: recsys-api-gateway
  namespace: recsys
  labels:
    app: recsys-api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: recsys-api-gateway
  template:
    metadata:
      labels:
        app: recsys-api-gateway
    spec:
      containers:
        - name: api-gateway
          image: recsys-backend-service:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: recsys-config
          env:
            - name: RECSYS_MAIN_CLASS
              value: com.recsys.microservice.MicroserviceGatewayServer
            - name: GATEWAY_PORT
              value: "8010"
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m"
          ports:
            - name: http
              containerPort: 8010
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 750m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: recsys-api-gateway
  namespace: recsys
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  type: LoadBalancer
  selector:
    app: recsys-api-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
