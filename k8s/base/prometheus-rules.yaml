# Alerts for the recsys services.
#
# Every expression here uses a metric name that exists in src/main/java — verified with
# `grep -rn '"<name>"' src/main/java` before this file was written. An alert on a metric
# that is never emitted is worse than no alert: it looks like coverage and can never fire.
#
# Thresholds are deliberately loose starting points. An alert that cries wolf gets muted,
# and a muted alert is worse than none. Tighten them with production data, not by guessing.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: recsys-alerts
  namespace: recsys
  labels:
    app: recsys
    release: kube-prometheus-stack
spec:
  groups:
    - name: recsys.availability
      rules:
        # The meta-alert. This is the one that would have caught online-serving and the
        # gateway publishing metrics nobody collected. Note its blind spot: `up` only
        # exists for targets Prometheus already knows about, so a ServiceMonitor that was
        # never created produces no series to be zero. ScrapeTargetManifestTest covers
        # that side; this covers a target that existed and stopped answering.
        - alert: RecsysTargetDown
          expr: up{namespace="recsys"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.job }} has not been scraped for 5 minutes"
            description: >-
              Prometheus cannot scrape {{ $labels.job }} ({{ $labels.instance }}). Either
              the service is down or its metrics endpoint stopped answering. Its dashboards
              and every other alert in this file are blind for that service until resolved.
              Check the service pod status with kubectl and its logs for startup errors.

    - name: recsys.logging
      rules:
        - alert: SplunkHecDroppingEvents
          expr: increase(splunk_hec_events_dropped_total[10m]) > 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Splunk log shipping is dropping events on {{ $labels.job }}"
            description: >-
              The appender's bounded queue filled and events were discarded. Log delivery is
              at-most-once by design, so these are gone from Splunk — stdout remains the
              authoritative copy. Consider raising SPLUNK_HEC_QUEUE_CAPACITY, or investigate
              why the drain thread fell behind.

        - alert: SplunkHecIndeterminateDelivery
          expr: increase(splunk_hec_events_indeterminate_total[10m]) > 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Splunk delivery outcome unknown on {{ $labels.job }}"
            description: >-
              Batches were sent but never acknowledged, so Splunk may or may not hold them.
              Unlike dropped events these carry duplicate risk as well as loss risk. Usually
              a read timeout or a shutdown that outran its budget.

    - name: recsys.serving
      rules:
        - alert: GatewayRegistryStale
          # GatewayRegistryMetrics reports the sentinel -1 (not NaN, not absent) when the
          # gateway has never completed a refresh since boot — `-1 > 120` is false, so a
          # gateway that has NEVER resolved anything would otherwise stay silent forever
          # while one merely three minutes stale pages. Same shape as RedisReplicaLagHigh's
          # NaN-vs-`>` trap below: a sentinel/failure value that looks like "no problem" to
          # a bare `>` comparison needs its own explicit branch.
          expr: gateway_registry_snapshot_age_seconds > 120 or gateway_registry_snapshot_age_seconds == -1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Gateway service-registry snapshot is stale or has never refreshed"
            description: >-
              The gateway is resolving upstreams from a registry snapshot older than two
              minutes, or has never completed a refresh since it started (reported as -1),
              so it may route to addresses that have moved. Check Redis availability and
              gateway_registry_refresh_failures_total.

        - alert: OnlineServingShedding
          expr: online_serving_rejected_rate > 0.1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Online serving is shedding more than 10% of requests"
            description: >-
              Admission control has been rejecting a sustained share of traffic. Either
              genuine overload or too tight a concurrency limit — check
              recsys_load_shedder_utilization and the pod's CPU.

    - name: recsys.data
      rules:
        - alert: RedisCacheUnavailable
          expr: redis_cache_available == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Redis is unreachable from {{ $labels.job }}"
            description: >-
              The cache probe cannot reach Redis. Serving degrades to stale or empty results
              depending on the path. Check the Redis pods and the NetworkPolicy egress rules.

        - alert: RedisReplicaLagHigh
          expr: redis_replica_lag_seconds > 10 or redis_replica_lag_available == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Redis replica lag above 10s or probe unavailable"
            description: >-
              AZ-aware replica reads are returning data more than ten seconds old, or the
              replica probe cannot determine lag at all. Reads routed to a replica may
              contradict a write that already succeeded. Check replica pod status and
              network connectivity between replicas.

        - alert: OutboxBacklogGrowing
          # delta(), not increase(): this is a true gauge that rises AND falls, and increase()
          # would read every drain as a counter reset. increase() is correct for the
          # splunk_hec_* gauges above only because those are monotonic.
          expr: outbox_pending_events > 1000 and delta(outbox_pending_events[15m]) > 0
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "Transactional outbox backlog is growing"
            description: >-
              More than 1000 events are pending and the backlog is still increasing, so the
              relay is not keeping up. Eventual consistency windows widen until it drains.
              Check outbox_delivery_failures_total and outbox_delivery_lag_seconds.

        # --- Serving data freshness SLOs (internal objectives, not customer SLAs) ---
        # See docs/runbooks/serving-data-freshness.md and
        # docs/superpowers/specs/2026-08-04-serving-data-freshness-slos-design.md.
        #
        # Every one of these reads a series produced by a real process: the feature gauges come
        # from OnlinePredictionServer's RedisFeatureVersionSampler, the outbox series from the
        # relay — which only became scrapeable alongside these rules. ScrapeTargetManifestTest
        # holds that scrape path together and ConsistencyMetricsTest pins the exposition names.

        - alert: OnlineFeatureDataStale
          # Scoped to online serving on purpose. EVERY process that builds a ConsistencyMetrics
          # registers these gauges, including the outbox relay, which runs no sampler and so
          # reports a permanent age of 0. Unscoped, this would evaluate against processes that
          # were never meant to observe the feature view.
          expr: redis_feature_version_age_seconds{job="recsys-online-serving"} > 60
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Online feature view older than 60s on {{ $labels.instance }}"
            description: >-
              The newest *:updated_at version in Redis is more than 60 seconds old, which is
              the whole stale-on-error budget OnlineFeatureStore is allowed to serve within.
              Recommendations are being built from a feature view that stopped advancing.
              Check the Flink online-feature job for a stalled or restarting task, then Kafka
              consumer lag on its source topics. See docs/runbooks/serving-data-freshness.md.

        - alert: OnlineFeatureDataCriticallyStale
          expr: redis_feature_version_age_seconds{job="recsys-online-serving"} > 300
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Online feature view older than 300s on {{ $labels.instance }}"
            description: >-
              The online feature view has been more than five minutes old for five minutes,
              far outside the 60-second window serving is designed to tolerate. Treat the
              recommendations being served as built from abandoned data. Check the Flink job
              and Kafka first, then whether Redis lost the feature keyspace entirely.
              See docs/runbooks/serving-data-freshness.md.

        - alert: OnlineFeatureVersionSampleUnavailable
          # The companion the two rules above depend on. redis_feature_version_age_seconds
          # initializes to 0 and only moves when a sample succeeds, and it is deliberately NOT
          # cleared on failure — so a sampler that has never reached Redis, or has stopped
          # reaching it, reads as a low, healthy-looking age that can never trip a `>`
          # comparison. Without this rule that failure is invisible.
          expr: redis_feature_version_sample_available{job="recsys-online-serving"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Online feature version sampling is not succeeding on {{ $labels.instance }}"
            description: >-
              No feature-version sample has succeeded for five minutes, so
              redis_feature_version_age_seconds is frozen at its last good value and cannot be
              trusted as a freshness reading — a low age here is stale evidence, not fresh
              data. Either Redis is unreachable from online serving or no *:updated_at keys
              exist. See docs/runbooks/serving-data-freshness.md.

        - alert: OutboxDeliveryLatencyHigh
          # _max, not the bare meter name: Micrometer exposes a Timer as _count/_sum/_max and
          # `outbox_delivery_lag_seconds` alone matches no series at all. It is a decaying
          # window max, so it falls back toward 0 when deliveries stop entirely — that case is
          # OutboxBacklogGrowing's, not this rule's.
          expr: outbox_delivery_lag_seconds_max{destination="kafka_online"} > 30
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "kafka_online outbox delivery slower than 30s"
            description: >-
              Durable online-event delivery has been taking longer than 30 seconds for ten
              minutes, so writes accepted by the API are reaching Kafka well outside the
              intended consistency window. Check relay logs, the MySQL outbox backlog
              (outbox_pending_events), and Kafka broker reachability from the relay.
              See docs/runbooks/serving-data-freshness.md.

        - alert: OutboxDeliveryFailuresSustained
          # 5m lookback under a 10m hold, deliberately shorter than the hold. The counter
          # increments once per failed ATTEMPT and the relay retries, so one transient blip is
          # routine. A 10m lookback would keep a single increment true for a full 10m and page
          # on it; a 5m lookback cannot span the hold, so only continuing failures fire.
          expr: increase(outbox_delivery_failures_total{destination="kafka_online"}[5m]) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "kafka_online outbox deliveries are failing continuously"
            description: >-
              Delivery attempts to kafka_online have been failing without a break for ten
              minutes, so the relay is retrying rather than draining. Events remain durable in
              the MySQL outbox, but the consistency window widens for as long as this lasts,
              and events that exhaust the retry policy are marked dead. Check relay logs for
              the failure class and Kafka reachability.
              See docs/runbooks/serving-data-freshness.md.

    - name: recsys.runtime
      rules:
        # --- JVM heap/GC pressure and request-latency SLOs ---
        # jvm_memory_used_bytes / jvm_memory_max_bytes / jvm_gc_pause_seconds_sum come from
        # JvmMetricsBinder (bound on all three Armeria mains: 6010, 7010, 8010). The three
        # *_request_duration_seconds_bucket series come from RequestDurationHistogram, the
        # MeterFilter that installs explicit SLO boundaries (50ms/100ms/250ms/400ms/500ms/1s/2s/5s)
        # on Armeria's *.request.duration timers -- MetricCollectingService alone only publishes
        # client-side quantile= series, not _bucket series, so histogram_quantile against those
        # would match nothing. All four prefixes verified against a live /metrics exposition
        # before this file was written.
        #
        # These three watch the request path and the runtime underneath it (heap, GC, p99
        # latency), not the data at rest or in flight -- recsys.data above is scoped to the
        # freshness/consistency boundary (outbox, feature view, Redis replica lag); this group
        # is scoped to whether a service is currently able to serve traffic well.

        - alert: JvmHeapPressureHigh
          # namespace="recsys" is load-bearing, not decoration: jvm_memory_used_bytes /
          # jvm_memory_max_bytes are emitted by every Micrometer/JMX JVM Prometheus scrapes,
          # not just ours -- see RecsysTargetDown's `up{namespace="recsys"}` for the same
          # pattern. Unscoped, this pages on foreign workloads with {{ $labels.job }} naming
          # a service that isn't recsys at all.
          expr: >-
            sum by (job, instance) (jvm_memory_used_bytes{area="heap", namespace="recsys"})
            /
            sum by (job, instance) (jvm_memory_max_bytes{area="heap", namespace="recsys"} > 0)
            > 0.90
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.job }} heap is above 90% used"
            description: >-
              Sustained heap pressure. Expect longer GC pauses and, past this, allocation
              stalls. Cross-check the Splunk heap-pressure events from the same service for
              what was running at the crossing. The `> 0` filter on jvm_memory_max_bytes is
              load-bearing: pools with no maximum report -1, and including them makes the
              ratio meaningless.

        - alert: JvmGcTimeFractionHigh
          # for: (10m) deliberately exceeds the rate() range (5m). Unlike increase()/delta() on
          # a counter -- where one isolated event holds the expression true for exactly the
          # range window, so for: >= range can never be satisfied (see OutboxDeliveryFailuresSustained
          # above) -- rate() over a SUSTAINED condition doesn't have a knife edge: if pause time
          # stays above 10% of wall time, the rate crosses 0.10 a little after the first 5m
          # window fills and then stays above it for as long as the pressure lasts. A burst
          # shorter than roughly the range (a GC blip lasting a couple of minutes) pushes the
          # rate over 0.10 only briefly and it drops back before the hold completes, so it
          # correctly does NOT fire -- proven by the short-burst case in
          # prometheus-rules.test.yaml.
          #
          # Detection latency on a sustained overshoot: MEASURED, not derived, with promtool's
          # promql_expr_test against two sustained input series (a linear ramp that never stops,
          # not a burst) -- a prior version of this comment stated "range/2 + for" from reasoning
          # about rate() instead of measuring it, and it was wrong. A 2x overshoot (settles at
          # 0.20/s) crosses 0.10 at t=3m and the alert fires at t=13m; a marginal overshoot
          # (settles at 0.11/s) crosses at t=5m and fires at t=15m -- so real detection latency
          # here is roughly 13-15m, slower for a marginal overshoot because rate()'s own
          # boundary extrapolation takes longer to climb across the threshold when the true
          # rate is barely above it. Not a false negative on sustained pressure, just latency.
          # namespace="recsys" is load-bearing here too, same reasoning as JvmHeapPressureHigh
          # immediately above: jvm_gc_pause_seconds_sum is a generic Micrometer JVM metric name,
          # not one of ours.
          expr: sum by (job, instance) (rate(jvm_gc_pause_seconds_sum{namespace="recsys"}[5m])) > 0.10
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.job }} is spending over 10% of wall time in GC pause"
            description: >-
              More than a tenth of elapsed time is stop-the-world pause, which shows up
              directly as request latency. Check JvmHeapPressureHigh on the same instance
              first — this is usually its consequence, not an independent fault.

        - alert: RequestLatencyP99High
          # Same for:-exceeds-range shape as JvmGcTimeFractionHigh immediately above: a 10m
          # hold against a 5m rate() range is not the increase()/delta() knife-edge, it costs
          # detection latency rather than a false negative, and a latency spike shorter than
          # about the range window correctly does not page.
          #
          # The detection-latency NUMBER does not carry over, though, and was not assumed by
          # analogy -- measured separately with promql_expr_test because this expression
          # compares a RATIO between bucket rates (histogram_quantile), not an absolute rate
          # against a threshold, and the two do not climb the same way. For a sustained input
          # where all traffic lands in one bucket above the threshold (a clean step, not a
          # marginal one), the quantile is already at its steady value from the very first
          # evaluation -- rate()'s boundary-extrapolation bias affects the numerator and
          # denominator bucket series identically here, so it cancels out of the ratio instead
          # of delaying the crossing the way it does for JvmGcTimeFractionHigh's absolute
          # comparison -- and the alert fires at t=11m, essentially just the for: window with no
          # extra rate-side delay. That is one measured point, not a general formula: a
          # marginal overshoot straddling a bucket boundary was not measured and could behave
          # differently, so treat 13-15m as specific to the counter-rate alert above and not a
          # number to reuse here.
          #
          # Fourth branch: the Spring model service (8080). Its histogram is a different
          # metric entirely -- http_server_requests_seconds_bucket, from Micrometer's
          # percentiles-histogram (management.metrics.distribution.percentiles-histogram.
          # http.server.requests: true in application.yml), not RequestDurationHistogram's
          # explicit SLO boundaries -- confirmed empirically by booting the service and
          # scraping /actuator/prometheus (207 series; bucket boundaries are Micrometer's own
          # exponential set, e.g. ...0.894784851, 0.984263336, 1.073741824, 1.431655765...,
          # not the Armeria services' 0.05/0.1/0.25/0.4/0.5/1/2/5).
          #
          # That metric name is a generic Spring Boot / Actuator name, emitted by every Spring
          # Boot application, unlike the three repo-unique prefixes above -- so namespace="recsys"
          # scoping here is load-bearing, not decoration, same reasoning as JvmHeapPressureHigh
          # and JvmGcTimeFractionHigh above (PR #293 review caught exactly this class of bug on
          # those two). No job="..." filter is added on top of it: the expression already groups
          # by (le, job), and every one of this repo's ServiceMonitors scrapes only within the
          # recsys namespace, so namespace scoping alone already excludes any foreign job a
          # shared Prometheus might also be scraping.
          #
          # uri!~"/actuator.*" excludes Actuator's own endpoint: Actuator instruments itself, and
          # Prometheus scrapes /actuator/prometheus every 15s -- confirmed by inspecting a live
          # scrape, where the self-scrape series carries uri="/actuator/prometheus" exactly, not
          # some other prefix. Uninstrumented out, those fast self-requests would dilute the p99
          # of real serving traffic downward -- proven by the actuator-dilution case in
          # prometheus-rules.test.yaml, where the same input fires when scoped to real traffic
          # but would not clear the threshold if Actuator's own requests were folded in unscoped.
          #
          # Threshold is 1s, matching catalog serving -- but CHOSEN, not derived, and that
          # distinction matters here more than for the other three: unlike online serving, whose
          # 0.4 is bound to ONLINE_REQUEST_TIMEOUT_MS, the model service enforces NO inbound
          # request timeout at all (application.yml's timeout-per-shutdown-phase governs
          # graceful shutdown, not per-request processing) -- so there is no timeout value this
          # threshold could be derived from, and none to become silently
          # unreachable if a timeout is added later the way the fourth trap in section 8.4
          # describes. 1s was picked because the model service shares catalog serving's 500ms
          # SLOW_REQUEST_LOG_THRESHOLD_MS default, not because of any enforced ceiling.
          expr: >-
            histogram_quantile(0.99, sum by (le, job) (
              rate(online_serving_request_duration_seconds_bucket[5m]))) > 0.4
            or
            histogram_quantile(0.99, sum by (le, job) (
              rate(catalog_serving_request_duration_seconds_bucket[5m]))) > 1
            or
            histogram_quantile(0.99, sum by (le, job) (
              rate(api_gateway_request_duration_seconds_bucket[5m]))) > 2
            or
            histogram_quantile(0.99, sum by (le, job) (
              rate(http_server_requests_seconds_bucket{namespace="recsys", uri!~"/actuator.*"}[5m]))) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.job }} p99 request latency is above its budget"
            description: >-
              Search Splunk for the same window with outcome=slow to see which routes and
              which requests. Thresholds differ per service and are bound to each one's
              enforced request timeout: online serving caps requests at 500ms
              (ONLINE_REQUEST_TIMEOUT_MS), so a threshold at or above 0.5 there could never
              fire. If a service gains or changes an explicit request timeout, its threshold
              must move with it. The model service branch is the exception: it has no enforced
              request timeout to bind a threshold to, so its 1s is a chosen value like catalog
              serving's, not a derived one.

        - alert: RecsysQueueFillingUp
          # Early warning, deliberately distinct from RecsysQueueRejecting below: this fires while
          # a queue is under pressure but has lost nothing. A queue can sit at 90% indefinitely and
          # be fine; what this catches is one that has stopped draining as fast as it fills, which
          # is the state that precedes loss and is invisible without this metric.
          #
          # for: 10m is the substance, not decoration -- at a 15s scrape that is ~40 consecutive
          # samples above the line. A queue that touches 0.8 for one scrape and drains is working
          # as designed and must not page.
          expr: recsys_queue_utilization > 0.7
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Queue {{ $labels.queue }} on {{ $labels.job }} is sustained above 70% full"
            description: >-
              Sustained pressure with nothing lost yet. Check whether the consumer has slowed
              (the recall workers for recall-catalog/recall-online, the drain thread for
              ab-exposures) before raising the bound -- a larger queue buys latency, not
              throughput. See docs/runbooks/overload-protection.md.

        - alert: RecsysQueueRejecting
          # Evidence of actual loss, not early warning. Scoped to reason="full" ON PURPOSE:
          # both implementations also count shutdown refusals, so an unscoped expression fires on
          # every rolling deploy. Dropping this matcher while "simplifying" the expression would
          # reintroduce deploy-time paging silently -- there is a promtool case pinning it.
          #
          # for: 3m sits well below the 10m increase() range per 18_Fault_Tolerance section 8.4:
          # an isolated burst ages out of the range and flips the expression false before a longer
          # for: is satisfied, which would defeat alerting on exactly the burst this is for.
          expr: increase(recsys_queue_rejected_total{reason="full"}[10m]) > 0
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "Queue {{ $labels.queue }} on {{ $labels.job }} is rejecting work"
            description: >-
              This queue is full and discarding work now. For ab-exposures that is lost A/B
              exposure events; for a recall bulkhead (recall-catalog/recall-online) it is
              degraded recommendations. Check recsys_queue_utilization for how long pressure
              had been building, and note that reason="shutdown" and reason="invalid_key" are
              deliberately excluded -- the latter is a data fault, not saturation.
