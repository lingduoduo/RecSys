# ConfigMap patch: point prod Redis at the us-west-2 ElastiCache Global Datastore
# SECONDARY endpoint (read replica; promoted to primary on failover — see
# docs/runbooks/dr-data-tier-promotion.md). Set REDIS_HOST before deploying.
#
# Required AWS-side configuration: same as k8s/eks/redis-elasticache-patch.yaml,
# including maxmemory-policy: volatile-lru on a custom parameter group. The DR
# secondary needs it just as much as the primary — it is promoted to primary on
# failover, and a secondary that evicted keys without a TTL is promoted already
# missing them. Global Datastore does not replicate parameter groups, so the
# us-west-2 group must be set independently:
#   AWS_REGION=us-west-2 PARAMETER_GROUP=<group> scripts/set-elasticache-parameters.sh apply
apiVersion: v1
kind: ConfigMap
metadata:
  name: recsys-config
  namespace: recsys
data:
  REDIS_MODE: "standalone"
  REDIS_HOST: "<us-west-2-elasticache-endpoint>.cache.amazonaws.com"
  REDIS_PORT: "6379"
  # DO NOT APPLY THIS OVERLAY until the us-west-2 ElastiCache cluster exists WITH
  # encryption-in-transit enabled AND an AUTH token. In EKS the in-cluster Redis is scaled to 0,
  # so every client dials ElastiCache, and LettuceClientFactory now refuses to start without a
  # password. As written below there is no working combination:
  #   - no redis-password  → every pod CrashLoopBackOff on the startup guard;
  #   - a password against a cluster with no AUTH token
  #                        → "ERR Client sent AUTH, but no password is set";
  #   - a password against a cluster that has one
  #                        → that cluster necessarily has transit encryption on, and
  #                          REDIS_TLS: "false" fails the handshake.
  # REDIS_TLS: "true", the redis-password key of recsys-secrets, and the AUTH-token-enabled
  # cluster are only valid as a set — land all three in the same change, never one at a time.
  # This region is a warm standby: it holds its own credential for its own cluster, so a rotation
  # in us-east-1 that skips here leaves a stale password that only surfaces during a failover.
  # See docs/runbooks/redis-auth.md.
  REDIS_TLS: "false"
  REDIS_SENTINEL_MASTER: ""
  REDIS_SENTINEL_NODES: ""
