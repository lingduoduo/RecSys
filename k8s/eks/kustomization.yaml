apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - gateway-irsa-sa.yaml    # IRSA ServiceAccount for the API gateway
  - patches/irsa-model-serving.yaml
  - waf-api-gateway-ingress.yaml   # WAF-protected ALB; sole public entry to the gateway

images:
  - name: recsys-backend-service
    newName: 123456789012.dkr.ecr.us-east-1.amazonaws.com/recsys-backend-service
    newTag: latest

replicas:
  - name: redis-primary
    count: 0
  - name: redis-replica
    count: 0
  - name: redis-sentinel
    count: 0

patches:
  # Add Cloud Map registration annotations to every ClusterIP Service.
  - path: cloud-map-service-patch.yaml
  # Set gateway timeout; in-cluster service URLs use kube-DNS (see the patch's comment).
  - path: configmap-patch.yaml
  # Force Always pull policy so ECR tag reassignment is picked up on every rollout.
  - path: image-pull-policy-patch.yaml
  # Override Redis config for ElastiCache (standalone mode, disable Sentinel env vars).
  - path: redis-elasticache-patch.yaml
  # Patch gateway Deployment to use the IRSA ServiceAccount.
  - path: gateway-irsa.yaml
  # Prefer same-AZ endpoints for in-cluster backend Services (cut inter-AZ traffic).
  - path: topology-aware-routing-patch.yaml
  # Drop the NLB: the WAF ALB Ingress (waf-api-gateway-ingress.yaml) is the sole
  # public entry, so the gateway Service becomes ClusterIP and its NLB-only
  # aws-load-balancer-* annotations are removed.
  - target:
      kind: Service
      name: recsys-api-gateway
      namespace: recsys
    patch: |
      - op: replace
        path: /spec/type
        value: ClusterIP
      - op: remove
        path: /metadata/annotations
