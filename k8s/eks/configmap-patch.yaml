# EKS-specific ConfigMap patch: use Cloud Map private DNS names for inter-service URLs.
#
# Within the cluster, Kubernetes DNS (recsys-model-serving.recsys.svc.cluster.local) is
# still the fast path. These Cloud Map hostnames are resolved via the Route 53 Resolver
# endpoint that VPC Lattice / Cloud Map registers in the VPC's private hosted zone, so
# the same names work for both in-cluster pods and external callers (Lambda, other clusters).
#
# DNS TTL for Cloud Map private namespaces defaults to 15 s. The gateway JVM is configured
# to cap its DNS cache at 30 s (networkaddress.cache.ttl=30) so endpoint changes propagate.
apiVersion: v1
kind: ConfigMap
metadata:
  name: recsys-config
  namespace: recsys
data:
  CATALOG_SERVICE_URL: "http://catalog-serving.recsys.internal:6010"
  MODEL_SERVICE_URL: "http://model-serving.recsys.internal:8080"
  ONLINE_SERVICE_URL: "http://online-serving.recsys.internal:7010"
  GATEWAY_TIMEOUT_MS: "3000"
