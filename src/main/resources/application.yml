server:
  port: 8080
  # Keeps Tomcat alive after SIGTERM until in-flight requests finish or the timeout elapses.
  # GracefulShutdownSupport flips /health/ready to 503 first so load balancers drain traffic.
  shutdown: graceful

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:recsys-model-serving}
  lifecycle:
    # Maximum time to wait for in-flight requests to complete before forcing shutdown.
    timeout-per-shutdown-phase: ${RECSYS_SHUTDOWN_TIMEOUT:30s}

debug: false

logging:
  level:
    root: INFO
    org.springframework: INFO

recsys:
  feature-flags:
    # Environment flags take precedence and use names such as FEATURE_FLAG_NEW_RANKING.
    environment-prefix: ${FEATURE_FLAG_ENVIRONMENT_PREFIX:FEATURE_FLAG_}
    post-hog:
      enabled: ${POSTHOG_FEATURE_FLAGS_ENABLED:false}
      api-key: ${POSTHOG_PROJECT_API_KEY:}
      # Required when enabled: distinct_id is a salted hash of the application userId, never the
      # userId itself. Rotating this re-buckets every user — see 20_AuthN_AuthZ.md.
      distinct-id-salt: ${POSTHOG_DISTINCT_ID_SALT:}
      host: ${POSTHOG_HOST:https://us.i.posthog.com}
      timeout: ${POSTHOG_FEATURE_FLAGS_TIMEOUT:2s}
      cache-ttl: ${POSTHOG_FEATURE_FLAGS_CACHE_TTL:60s}
  ab-test:
    enabled: false
    layer-name: default
    bucket-a-percent: ${RECSYS_AB_BUCKET_A_PERCENT:20}
    bucket-b-percent: ${RECSYS_AB_BUCKET_B_PERCENT:20}
    bucket-a-variant: test
    bucket-b-variant: training
    default-variant: training
  model:
    # Variant-aware model artifacts: classpath:artifacts/model/<variant>/... (default variant: training)
    artifacts-dir: ${RECSYS_MODEL_ARTIFACTS_DIR:}
    # ONNX model file resolved from the variant artifacts directory, then classpath root.
    file: ${RECSYS_MODEL_FILE:dssm_model.onnx}
    # Item embeddings can stay in artifact JSON for local demos, or be stripped
    # from the model package and loaded from Redis in production.
    item-embeddings-source: ${RECSYS_MODEL_ITEM_EMBEDDINGS_SOURCE:classpath}
    redis:
      item-embedding-prefix: ${RECSYS_MODEL_REDIS_ITEM_EMBEDDING_PREFIX:i2vEmb}
    onnx:
      intra-op-threads: ${RECSYS_MODEL_ONNX_INTRA_OP_THREADS:1}
      inter-op-threads: ${RECSYS_MODEL_ONNX_INTER_OP_THREADS:1}
      execution-mode: ${RECSYS_MODEL_ONNX_EXECUTION_MODE:SEQUENTIAL}
    recall:
      core-threads: ${RECSYS_MODEL_RECALL_CORE_THREADS:0}
      queue-capacity: ${RECSYS_MODEL_RECALL_QUEUE_CAPACITY:256}
      timeout-ms: ${RECSYS_MODEL_RECALL_TIMEOUT_MS:200}
  spark:
    # PySpark model artifacts output by the training pipeline (classpath:artifacts/pyspark/)
    artifacts-dir: ${RECSYS_SPARK_ARTIFACTS_DIR:}
  mysql:
    # Optional. The service does not connect to MySQL unless explicitly enabled by callers.
    #
    # NOTE: this whole block is UNBOUND. No @ConfigurationProperties(prefix = "recsys.mysql")
    # exists and the Spring model service never constructs MySqlConnectionSettings, so nothing
    # reads these keys — they are documentation of the env-var names, not live configuration.
    # That is why the useSSL=false below is not a transport hole: the MYSQL_URL that actually
    # reaches a connection is read from the environment by MySqlConnectionSettings.fromEnv(),
    # which requires sslMode=VERIFY_IDENTITY for any non-loopback host. If this block is ever
    # bound to a real properties class, the default URL must change with it.
    enabled: ${MYSQL_ENABLED:false}
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/recsys?useSSL=false&serverTimezone=UTC&connectTimeout=1000&socketTimeout=2000}
    username: ${MYSQL_USER:recsys}
    password: ${MYSQL_PASSWORD:}
    query-timeout-seconds: ${MYSQL_QUERY_TIMEOUT_SECONDS:2}
    read-max-attempts: ${MYSQL_READ_MAX_ATTEMPTS:2}
    read-retry-backoff-ms: ${MYSQL_READ_RETRY_BACKOFF_MS:50}
    # Required when MySQL catalog serving is enabled; inject through secret management.
    cursor-signing-key: ${MYSQL_CURSOR_SIGNING_KEY:}
  # Durable eventual consistency (transactional outbox, saga state, relay, consistency tokens,
  # reconciliation) is NOT a Spring feature. It runs in the online Armeria service and the
  # standalone OutboxRelayCommand / ReconciliationCommand, configured entirely through env vars
  # (ONLINE_DURABLE_EVENTS_ENABLED, ONLINE_CONSISTENCY_TOKEN_SECRET, OUTBOX_*, RECONCILIATION_*).
  # It reuses the MYSQL_* settings above. See docs/runbooks/durable-eventual-consistency.md.
  health:
    # Rolling window for latency/failure-rate metrics used by the readiness probe
    window-seconds: 60
    # Minimum requests in the window before the readiness probe applies thresholds
    min-sample-size: 5
    # Fraction of requests that may fail before the instance is pulled from rotation
    # DEMO ONLY: lower to 0.05 for production deployments
    max-failure-rate: 0.5
    # Average inference latency (ms) above which the instance is pulled from rotation
    max-avg-latency-ms: 2000
    # Per-instance overload protection. Excess requests fail fast with 503 + Retry-After.
    max-concurrent-requests: ${RECSYS_HEALTH_MAX_CONCURRENT_REQUESTS:64}
    # Above this in-flight utilization, /health/ready returns 503 so balancers drain this node.
    max-in-flight-utilization: ${RECSYS_HEALTH_MAX_IN_FLIGHT_UTILIZATION:0.95}
  recommendation-cache:
    # Caches full recommendation responses for repeated equivalent requests.
    enabled: ${RECSYS_RECOMMENDATION_CACHE_ENABLED:true}
    ttl-seconds: ${RECSYS_RECOMMENDATION_CACHE_TTL_SECONDS:300}
    max-entries: ${RECSYS_RECOMMENDATION_CACHE_MAX_ENTRIES:10000}
    # Unknown users all encode to the model's __UNK__ bucket, so their default
    # list can be precomputed once per model variant/version and reused.
    cold-start-enabled: ${RECSYS_RECOMMENDATION_CACHE_COLD_START_ENABLED:true}
    # Cold-start pool changes only on model deploy, so it can live much longer than per-user entries.
    cold-start-ttl-seconds: ${RECSYS_RECOMMENDATION_CACHE_COLD_START_TTL_SECONDS:3600}
    cold-start-max-k: ${RECSYS_RECOMMENDATION_CACHE_COLD_START_MAX_K:100}
    # Max time a duplicate request waits for another thread's in-flight cache miss.
    compute-wait-timeout-millis: ${RECSYS_RECOMMENDATION_CACHE_COMPUTE_WAIT_TIMEOUT_MILLIS:2000}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    username: ${REDIS_USERNAME:}
    tls: ${REDIS_TLS:false}
    mode: ${REDIS_MODE:standalone}
    timeout-ms: ${REDIS_TIMEOUT_MS:2000}
    # Comma-separated read-replica specs: host:port@az (e.g. redis-b:6379@us-east-1b)
    replica-nodes: ${REDIS_REPLICA_NODES:}
    sentinel-master: ${REDIS_SENTINEL_MASTER:mymaster}
    # Comma-separated sentinel endpoints: host:port (e.g. sentinel-1:26379,sentinel-2:26379)
    sentinel-nodes: ${REDIS_SENTINEL_NODES:}
    pool:
      max-total: ${REDIS_POOL_MAX_TOTAL:50}
      max-idle: ${REDIS_POOL_MAX_IDLE:10}
      min-idle: ${REDIS_POOL_MIN_IDLE:2}
      max-wait-ms: ${REDIS_POOL_MAX_WAIT_MS:250}
      test-on-borrow: ${REDIS_POOL_TEST_ON_BORROW:true}
  submit-token:
    # Optional one-time token protection for POST /api/v1/recommend.
    # When enabled, clients fetch GET /api/v1/token and send X-Submit-Token on submit.
    enabled: ${RECSYS_SUBMIT_TOKEN_ENABLED:false}
    ttl-seconds: ${RECSYS_SUBMIT_TOKEN_TTL_SECONDS:300}
    key-prefix: ${RECSYS_SUBMIT_TOKEN_KEY_PREFIX:submit_token:}
  events:
    # A/B exposure events can ship to SQS for AWS-native decoupling. SQS wins over Kafka
    # when both are configured; leave disabled for local/dev/tests.
    sqs:
      enabled: ${RECSYS_EVENTS_SQS_ENABLED:false}
      queue-url: ${RECSYS_EVENTS_SQS_QUEUE_URL:}
      region: ${RECSYS_EVENTS_SQS_REGION:${AWS_REGION:us-east-1}}
    # A/B exposure events ship to Kafka only when enabled=true AND bootstrap-servers is non-blank;
    # otherwise the publisher falls back to the log-only base (local/dev/tests need no broker).
    kafka:
      enabled: ${RECSYS_EVENTS_KAFKA_ENABLED:false}
      bootstrap-servers: ${RECSYS_EVENTS_KAFKA_BOOTSTRAP_SERVERS:}   # blank disables Kafka even when enabled=true
      exposure-topic: ${RECSYS_EVENTS_KAFKA_EXPOSURE_TOPIC:ab_exposures}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_EXPOSURE:health,info,prometheus}
      base-path: /actuator
  endpoint:
    health:
      show-details: never
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${SPRING_APPLICATION_NAME:recsys-model-serving}
    distribution:
      percentiles-histogram:
        http.server.requests: true
