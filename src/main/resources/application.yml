server:
  port: 8080

debug: false

logging:
  level:
    root: INFO
    org.springframework: INFO

recsys:
  model:
    # Two-tower serving artifacts: feature configs, pre-computed embeddings, ONNX model (classpath:artifacts/twotower/)
    artifacts-dir: ${RECSYS_MODEL_ARTIFACTS_DIR:}
  spark:
    # PySpark model artifacts output by the training pipeline (classpath:artifacts/pyspark/)
    artifacts-dir: ${RECSYS_SPARK_ARTIFACTS_DIR:}
