server:
  port: 8080

debug: false

logging:
  level:
    root: INFO
    org.springframework: INFO

recsys:
  ab-test:
    enabled: false
    layer-name: default
    traffic-split-number: 5
    bucket-a-variant: test
    bucket-b-variant: training
    default-variant: training
  model:
    # Variant-aware model artifacts: classpath:artifacts/model/<variant>/... (default variant: training)
    artifacts-dir: ${RECSYS_MODEL_ARTIFACTS_DIR:}
    # ONNX model file resolved from the variant artifacts directory, then classpath root.
    file: ${RECSYS_MODEL_FILE:dssm_model.onnx}
    # Item embeddings can stay in artifact JSON for local demos, or be stripped
    # from the model package and loaded from Redis in production.
    item-embeddings-source: ${RECSYS_MODEL_ITEM_EMBEDDINGS_SOURCE:classpath}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      item-embedding-prefix: ${RECSYS_MODEL_REDIS_ITEM_EMBEDDING_PREFIX:i2vEmb}
  spark:
    # PySpark model artifacts output by the training pipeline (classpath:artifacts/pyspark/)
    artifacts-dir: ${RECSYS_SPARK_ARTIFACTS_DIR:}
  health:
    # Rolling window for latency/failure-rate metrics used by the readiness probe
    window-seconds: 60
    # Minimum requests in the window before the readiness probe applies thresholds
    min-sample-size: 5
    # Fraction of requests that may fail before the instance is pulled from rotation
    # DEMO ONLY: lower to 0.05 for production deployments
    max-failure-rate: 0.5
    # Average inference latency (ms) above which the instance is pulled from rotation
    max-avg-latency-ms: 2000
  recommendation-cache:
    # Caches full recommendation responses for repeated equivalent requests.
    enabled: ${RECSYS_RECOMMENDATION_CACHE_ENABLED:true}
    ttl-seconds: ${RECSYS_RECOMMENDATION_CACHE_TTL_SECONDS:300}
    max-entries: ${RECSYS_RECOMMENDATION_CACHE_MAX_ENTRIES:10000}
    # Unknown users all encode to the model's __UNK__ bucket, so their default
    # list can be precomputed once per model variant/version and reused.
    cold-start-enabled: ${RECSYS_RECOMMENDATION_CACHE_COLD_START_ENABLED:true}
    # Cold-start pool changes only on model deploy, so it can live much longer than per-user entries.
    cold-start-ttl-seconds: ${RECSYS_RECOMMENDATION_CACHE_COLD_START_TTL_SECONDS:3600}
    cold-start-max-k: ${RECSYS_RECOMMENDATION_CACHE_COLD_START_MAX_K:100}
