# Local Splunk stand-in for HEC log shipping.
#
#   export SPLUNK_PASSWORD=changeme-splunk-admin
#   export SPLUNK_HEC_TOKEN=local-dev-hec-token
#   docker compose -f docker-compose.splunk.yml up -d
#   sh scripts/run-microservices-local.sh          # picks up SPLUNK_HEC_TOKEN
#   open http://localhost:8000                     # admin / $SPLUNK_PASSWORD
#
# Demonstrates HEC INGESTION ONLY. No indexer clustering, no search head cluster, no
# forwarders, no retention tiering — see docs/runbooks/splunk-hec-logging.md.
#
# REQUIRES AN x86_64 HOST. splunk/splunk publishes no arm64 image. On Apple Silicon,
# Docker Desktop will run it emulated (`platform: linux/amd64` below forces that), but
# splunkd segfaults during first-boot indexing under emulation:
#   Received fatal signal 11 (Segmentation fault) on PID <n>. Crashing thread:
#   IndexerTPoolWorker-0
# with a companion KVStore failure in splunkd.log ("mongod ... kvstore process
# terminated"). The container exits rc=2 after ansible exhausts its 5 start retries and
# the stack never becomes healthy. This is a platform limitation, not a bug in this
# compose file or in init.sh — do not "fix" it by weakening the healthcheck or the
# splunk-init verification loop. Run this stack on x86_64 (a real Linux box, an amd64 CI
# runner, or Docker Desktop with a Rosetta/QEMU setup that doesn't hit the segfault) to
# actually exercise it.
#
# NOT YET VERIFIED END TO END. This file and docker/splunk/init.sh were desk-checked
# against Splunk's published REST API docs (index creation, HEC global settings, HEC
# token creation, and the /services/collector/event + "Authorization: Splunk <token>"
# format) but have not been run to a passing splunk-init on this host, because the arm64
# host available for this work hits the segfault above. What IS verified: the appender's
# HEC wire format, batching, and Authorization header are proven against a stub HTTP
# collector in SplunkHecAppenderTest. Whoever runs this on x86_64 first should confirm
# splunk-init exits 0 and record it in docs/runbooks/splunk-hec-logging.md (Task 8).
#
# First boot (on a working host) takes 1-3 minutes — be patient with the healthcheck.
# If a first boot is interrupted (container killed, host restarted) before splunkd
# finishes initializing, splunk-etc/splunk-var are left half-provisioned and the next
# start fails fast with:
#   Checking appserver port [127.0.0.1:8065]: ...
#   ERROR: appserver port [127.0.0.1:8065] - port is already bound.
# (an internal port check tripping over a second splunkd being started against
# stale state — nothing external is bound there). The fix is
# `docker compose -f docker-compose.splunk.yml down -v` to discard the half-initialized
# volumes, then start clean. Also note Splunk wants more than the Docker Desktop default
# of 2 CPU / 4 GB RAM; under-provisioning won't cause the segfault above (that's an
# emulated-instruction fault, not a resource limit) but will slow first boot further.
services:
  splunk:
    image: splunk/splunk:latest
    # This image ships amd64-only; on Apple Silicon Docker Desktop runs it emulated via
    # Rosetta/QEMU. Slower first boot, but functionally correct for local demonstration.
    platform: linux/amd64
    container_name: splunk
    environment:
      SPLUNK_START_ARGS: --accept-license
      # This image version enforces both flags together; SPLUNK_START_ARGS alone is not
      # sufficient (confirmed empirically — the entrypoint refuses to boot without it).
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD:?set SPLUNK_PASSWORD before starting Splunk}
      # Honoured by the image's ansible layer. splunk-init verifies and repairs both,
      # so a version that ignores them still ends up correct.
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN:?set SPLUNK_HEC_TOKEN before starting Splunk}
      SPLUNK_HEC_SSL: "False"
    ports:
      - "8000:8000"   # Splunk web UI
      - "8088:8088"   # HTTP Event Collector
    volumes:
      - splunk-etc:/opt/splunk/etc
      - splunk-var:/opt/splunk/var
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -kfsS https://localhost:8089/services/server/health/splunkd/details \
           -u admin:${SPLUNK_PASSWORD} >/dev/null"
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s

  # One-shot: create the index, force HEC onto plain HTTP, prove it accepts an event.
  splunk-init:
    image: curlimages/curl:8.10.1
    container_name: splunk-init
    depends_on:
      splunk:
        condition: service_healthy
    environment:
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD}
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN}
      SPLUNK_HEC_INDEX: ${SPLUNK_HEC_INDEX:-recsys}
    volumes:
      - ./docker/splunk/init.sh:/init.sh:ro
    entrypoint: ["sh", "/init.sh"]
    restart: "no"

volumes:
  splunk-etc:
  splunk-var:
